upstream hermes_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name hermes-platform.local;

    # 如果需要 HTTPS，取消注释以下配置
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/hermes.crt;
    # ssl_certificate_key /etc/nginx/ssl/hermes.key;

    client_max_body_size 1m;
    client_body_timeout  300s;  # Hermes 响应可能较慢

    location /api/ {
        proxy_pass http://hermes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://hermes_api/api/v1/health;
        access_log off;
    }
}

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f7f7f7;
  --sidebar: #ffffff;
  --chat-bg: #ffffff;
  --user-bubble: #e3e3e3;
  --assistant-bubble: #ffffff;
  --accent: #d97757;
  --accent-dim: #d9775744;
  --accent-hover: #c5623f;
  --text: #1a1a1a;
  --text-dim: #8b8b8b;
  --border: #e5e5e5;
  --danger: #ef4444;
  --success: #22c55e;
  --hover: #f0f0f0;
  --code-bg: #f4f4f4;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
}

/* ── Sidebar ── */
.sidebar {
  width: 260px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h2 {
  font-size: 15px;
  font-weight: 600;
}

.conn-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--danger);
  display: inline-block;
  margin-right: 6px;
}

.conn-dot.ok { background: var(--success); }

.conn-label { font-size: 11px; color: var(--text-dim); }

.btn-new-chat {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
}

.btn-new-chat:hover { background: var(--hover); }

.sidebar-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-section label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: block;
  margin-bottom: 6px;
}

.sidebar-section input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}

.sidebar-section input:focus { border-color: var(--accent); }

.btn {
  width: 100%;
  padding: 9px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-danger-sm {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  padding: 6px 0;
  width: 100%;
  text-align: left;
}

.btn-danger-sm:hover { color: var(--danger); }

/* ── Session list ── */
.session-list {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.session-list::-webkit-scrollbar { width: 4px; }
.session-list::-webkit-scrollbar-track { background: transparent; }
.session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.session-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.1s;
  gap: 8px;
  position: relative;
}

.session-item:hover { background: var(--hover); }

.session-item.active {
  background: var(--hover);
}

.session-item .session-title {
  flex: 1;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.session-item .session-title-input {
  flex: 1;
  font-size: 13px;
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 2px 6px;
  outline: none;
  background: #fff;
  min-width: 0;
}

.session-item .session-actions {
  display: none;
  gap: 2px;
  flex-shrink: 0;
}

.session-item:hover .session-actions { display: flex; }

.session-action-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
  border-radius: 4px;
  line-height: 1;
}

.session-action-btn:hover { background: var(--border); color: var(--text); }
.session-action-btn.danger:hover { color: var(--danger); }

.session-group-label {
  padding: 10px 16px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  user-select: none;
}

.session-empty {
  padding: 24px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
}

/* ── Sidebar footer ── */
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

/* ── Main area ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
  background: var(--chat-bg);
}

/* ── Settings overlay (covers chat area) ── */
.settings-col {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  background: var(--sidebar);
}

.settings-nav {
  width: 180px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: 12px 0;
  overflow-y: auto;
}

.snav-item {
  display: block;
  width: 100%;
  padding: 10px 20px;
  font-size: 14px;
  color: var(--text);
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  transition: background 0.1s;
}
.snav-item:hover { background: var(--hover); }
.snav-item.active { background: var(--hover); font-weight: 600; color: var(--accent); }

.settings-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ── Messages ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: var(--text-dim);
}

.empty-state .logo { font-size: 48px; opacity: 0.3; }
.empty-state p { font-size: 14px; }

.msg {
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding: 16px 24px;
}

.msg-label {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-dim);
}

.msg-body {
  font-size: 15px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.user { background: var(--bg); }
.msg.user .msg-attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; max-width: 85%; }
.msg.user .msg-body { background: var(--user-bubble); border-radius: 18px; padding: 10px 16px; display: inline-block; max-width: 85%; }

.msg.assistant .msg-body { padding: 0; }
.msg.assistant .msg-body.md { line-height: 1.7; }
.msg.assistant .msg-body.md p { margin: 0 0 12px 0; }
.msg.assistant .msg-body.md p:last-child { margin-bottom: 0; }
.msg.assistant .msg-body.md ul, .msg.assistant .msg-body.md ol { margin: 0 0 12px 0; padding-left: 24px; }
.msg.assistant .msg-body.md li { margin-bottom: 4px; }
.msg.assistant .msg-body.md h1, .msg.assistant .msg-body.md h2, .msg.assistant .msg-body.md h3, .msg.assistant .msg-body.md h4 { margin: 16px 0 8px 0; font-weight: 600; }
.msg.assistant .msg-body.md h1 { font-size: 1.4em; }
.msg.assistant .msg-body.md h2 { font-size: 1.2em; }
.msg.assistant .msg-body.md h3 { font-size: 1.05em; }
.msg.assistant .msg-body.md blockquote { border-left: 3px solid var(--accent); margin: 0 0 12px 0; padding: 4px 16px; color: var(--text-dim); }
.msg.assistant .msg-body.md table { border-collapse: collapse; margin: 0 0 12px 0; font-size: 14px; width: 100%; }
.msg.assistant .msg-body.md th, .msg.assistant .msg-body.md td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.msg.assistant .msg-body.md th { background: var(--bg); font-weight: 600; }
.msg.assistant .msg-body.md a { color: var(--accent); text-decoration: none; }
.msg.assistant .msg-body.md a:hover { text-decoration: underline; }
.msg.assistant .msg-body.md img { max-width: 100%; border-radius: 8px; }
.msg.assistant .msg-body.md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.msg.assistant .msg-body.md code:not(pre code) { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
.msg.assistant .msg-body.md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; margin: 0 0 12px 0; overflow-x: auto; position: relative; }
.msg.assistant .msg-body.md pre code { display: block; padding: 14px 16px; font-size: 13px; line-height: 1.6; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
.md-code-copy { position: absolute; top: 6px; right: 6px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; color: var(--text-dim); opacity: 0; transition: opacity .15s; }
.msg.assistant .msg-body.md pre:hover .md-code-copy { opacity: 1; }
.md-code-copy:hover { background: var(--hover); color: var(--text); }
.msg.system .msg-body { font-size: 12px; color: var(--text-dim); font-style: italic; }
.att-card { display: inline-flex; align-items: center; gap: 8px; background: var(--user-bubble); border-radius: 12px; padding: 8px 12px; max-width: 260px; overflow: hidden; cursor: pointer; text-decoration: none; color: inherit; transition: background .15s; }
.att-card:hover { background: var(--hover); }
.att-card .att-icon { font-size: 20px; flex-shrink: 0; width: 32px; height: 32px; background: var(--bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.att-card .att-info { min-width: 0; flex: 1; }
.att-card .att-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-weight: 500; font-size: 13px; }
.att-card .att-size { display: block; font-size: 11px; color: var(--text-dim); margin-top: 1px; }

.msg.streaming .msg-body::after {
  content: '';
  display: inline-block;
  width: 2px; height: 16px;
  background: var(--accent);
  margin-left: 3px;
  vertical-align: text-bottom;
  animation: cursorBlink 0.6s steps(2) infinite;
}
.msg.streaming .msg-label::after {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  margin-left: 6px;
  vertical-align: middle;
  animation: pulse 1.2s ease-in-out infinite;
}

/* Tool running card */
.msg.tool-running {
  background: linear-gradient(135deg, #fef3ee 0%, #fff7f4 100%);
  border: 1px solid var(--accent-dim);
  border-radius: 10px;
  padding: 8px 14px;
}
.msg.tool-running .msg-body {
  font-size: 12px; color: var(--text); font-style: normal;
  display: flex; align-items: center; gap: 8px;
}
.msg.tool-running .tool-dots span {
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--accent);
  border-radius: 50%;
  animation: dotBounce 1.4s ease-in-out infinite;
}
.msg.tool-running .tool-dots span:nth-child(2) { animation-delay: 0.2s; }
.msg.tool-running .tool-dots span:nth-child(3) { animation-delay: 0.4s; }

.msg-usage {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
}

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes cursorBlink { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
@keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Thinking bar ── */
.thinking-bar {
  display: flex; align-items: center; gap: 10px;
  max-width: 680px; width: 100%;
  margin: 0 auto 8px auto;
  padding: 8px 16px;
  background: linear-gradient(135deg, #fef3ee 0%, #fff7f4 100%);
  border: 1px solid var(--accent-dim);
  border-radius: 10px;
  animation: slideDown 0.25s ease;
}
.thinking-dots { display: flex; gap: 4px; }
.thinking-dots span {
  display: inline-block; width: 7px; height: 7px;
  background: var(--accent); border-radius: 50%;
  animation: dotBounce 1.4s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
.thinking-text { font-size: 12px; color: var(--accent); font-weight: 500; }

/* ── Input area ── */
.input-area {
  padding: 16px 24px 24px;
}

.input-wrap {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  gap: 6px;
  align-items: flex-end;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 6px 6px 4px;
  transition: border-color 0.15s;
}

.input-wrap:focus-within { border-color: var(--accent); }

.input-wrap.dragover { border-color: var(--accent); background: #fdf0ec; }

.input-wrap textarea {
  flex: 1;
  background: transparent;
  border: none;
  padding: 6px 10px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  min-height: 28px;
  max-height: 160px;
  line-height: 1.5;
}

.input-wrap textarea::placeholder { color: var(--text-dim); }

.pending-file {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-dim); border-radius: 6px;
  padding: 4px 10px; margin: 2px 4px; font-size: 12px;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pending-file .pf-name { overflow: hidden; text-overflow: ellipsis; }
.pending-file .pf-remove {
  cursor: pointer; color: var(--text-dim); font-size: 14px; line-height: 1;
  flex-shrink: 0;
}
.pending-file .pf-remove:hover { color: var(--danger); }
#pendingFiles { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 6px 0; }

.btn-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}

.btn-icon:hover { background: var(--border); color: var(--text); }
.btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-icon.send {
  background: var(--accent);
  color: #fff;
}

.btn-icon.send:hover { background: var(--accent-hover); }
.btn-icon.send:disabled { background: var(--border); color: var(--text-dim); }

/* ── Hidden file input ── */
.file-input { display: none; }

/* ── GitHub login button ── */
.btn-github {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 12px 20px;
  background: #24292e; color: #fff; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
}
.btn-github:hover { background: #2f363d; }
.btn-github svg { flex-shrink: 0; }

/* ── Settings panel (inline split) ── */
.settings-header {
  padding: 20px 24px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.settings-header h3 { font-size: 18px; font-weight: 600; }
.settings-close {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: none; color: var(--text-dim); font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.settings-close:hover { background: var(--hover); color: var(--text); }

.settings-body {
  flex: 1; overflow-y: auto; padding: 20px 24px 40px;
}
.settings-body::-webkit-scrollbar { width: 4px; }
.settings-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.settings-loading {
  display: flex; justify-content: center; padding: 60px 0; color: var(--text-dim); font-size: 14px;
}

/* ── Welcome screen & loading ── */
.welcome-screen {
  position: absolute; inset: 0; z-index: 100;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.3s ease;
}
.welcome-card {
  width: 380px; text-align: center; padding: 48px 36px 36px;
  background: var(--sidebar); border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 24px rgba(0,0,0,0.06);
}
.welcome-card .logo { font-size: 42px; margin-bottom: 8px; }
.welcome-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.welcome-card p { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
.welcome-card label { display: block; text-align: left; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-dim); }
.welcome-card input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; outline: none; background: var(--bg); color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.welcome-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217,119,87,0.12); }
.welcome-card .field + .field { margin-top: 14px; }
.welcome-card .btn {
  width: 100%; margin-top: 20px; padding: 11px; font-size: 14px; font-weight: 600;
  border-radius: 10px; transition: all 0.2s;
}
.welcome-card .btn:disabled { opacity: 0.6; cursor: not-allowed; }
.welcome-card .btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(217,119,87,0.3); }

.loading-overlay {
  position: absolute; inset: 0; z-index: 100;
  background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
}
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.loading-steps { display: flex; flex-direction: column; gap: 8px; min-width: 200px; }
.loading-step {
  display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim);
  transition: color 0.3s, opacity 0.3s;
}

<script>
// ── State ──
let ws = null;
let brokerInfo = null;
let rpcId = 0;
let pending = {};
let activeConvId = null;
let streamState = {};
let _heartbeatTimer = null;
let _reconnectTimer = null;
let _userDisconnect = false;
let _reconnectAttempts = 0;
const MAX_RECONNECT = 10;
let conversations = {};
let currentModel = '';

const $ = id => document.getElementById(id);

// ── LocalStorage ──
function storageKey(uid) { return 'hermes_chat_' + uid; }

function save() {
  if (!_currentUid) return;
  const out = {};
  for (const [id, c] of Object.entries(conversations)) {
    out[id] = { id: c.id, hermesSid: c.hermesSid, sessionKey: c.sessionKey,
                title: c.title, messages: c.messages,
                createdAt: c.createdAt, updatedAt: c.updatedAt };
  }
  localStorage.setItem(storageKey(_currentUid), JSON.stringify(out));
}

function load(uid) {
  _currentUid = uid || _currentUid;
  conversations = {};
  const raw = _currentUid && localStorage.getItem(storageKey(_currentUid));
  if (raw) { try { conversations = JSON.parse(raw); } catch(e) {} }
}

function convByHermesSid(sid) {
  for (const [id, c] of Object.entries(conversations)) {
    if (c.hermesSid === sid) return id;
  }
  return null;
}

function isConvStreaming(id) { return !!streamState[id]; }

// ── Textarea ──
$('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});

// ── Drag & drop ──
const inputWrap = $('inputWrap');
inputWrap.addEventListener('dragover', e => { e.preventDefault(); inputWrap.classList.add('dragover'); });
inputWrap.addEventListener('dragleave', () => inputWrap.classList.remove('dragover'));
inputWrap.addEventListener('drop', e => {
  e.preventDefault();
  inputWrap.classList.remove('dragover');
  const files = e.dataTransfer?.files;
  if (files?.length) uploadFiles(files);
});

// ── Connect ──

let _oauthMode = false;  // auto-detected on page load
let _currentUid = '';    // effective user_id for storage key

function loginWithGitHub() {
  window.location.href = window.location.origin + '/auth/github';
}

async function detectAuthMode() {
  try {
    const resp = await fetch(window.location.origin + '/auth/user', { credentials: 'include' });
    if (resp.ok) {
      const user = await resp.json();
      _oauthMode = true;
      return user;  // {sub, name, avatar}
    }
    if (resp.status === 401) {
      // Auth endpoint exists → OAuth mode, but not logged in
      _oauthMode = true;
      return null;
    }
  } catch(e) {}
  // Auth endpoint not found → legacy mode
  _oauthMode = false;
  return null;
}

async function connect(uid, silent) {
  const url = window.location.origin;
  if (!_oauthMode && !uid) {
    uid = $('userId')?.value?.trim();
    if (!uid) { $('userId')?.focus(); return; }
  }
  if (uid) _currentUid = uid;

  setConn('connecting');
  if (!silent) showLoading('alloc');

  try {
    const fetchOpts = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(_oauthMode ? {} : { user_id: uid }),
      credentials: 'include',
    };

    let resp = await fetch(url + '/api/sessions', fetchOpts);
    if (resp.status === 401) {
      if (!silent) hideLoading();
      window.location.href = url + '/auth/github';
      return;
    }
    if (!resp.ok) throw new Error('Failed to allocate process');
    brokerInfo = await resp.json();

    const effectiveUid = brokerInfo.user_id || uid || 'user';

    if (!silent) showLoading('load');
    load(effectiveUid);
    await loadServerSessions();

    if (!silent) showLoading('ws');
    await connectWS();

    if (!silent) showLoading('model');
    await loadModelInfo();

    $('btnNewChat').style.display = '';
    $('sidebarFooter').style.display = '';
    $('footerUserName').textContent = effectiveUid;
    $('userAvatar').textContent = effectiveUid.charAt(0).toUpperCase();

    // Resume or create
    const ids = Object.keys(conversations)
      .sort((a, b) => (conversations[b].updatedAt||0) - (conversations[a].updatedAt||0));
    if (ids.length > 0) {
      let resumed = false;
      for (const id of ids) {
        const conv = conversations[id];
        if (conv.sessionKey) {
          try {
            if (!silent) showLoading('resume');
            const result = await rpc('session.resume', { session_id: conv.sessionKey });
            conv.hermesSid = result.session_id;
            resumed = true;
            doSwitchConv(id);
            break;
          } catch (e) { conv.hermesSid = null; }
        }
      }
      if (!resumed) { doSwitchConv(ids[0]); await newConversation(); }
      else {
        for (const id of ids) { if (id !== activeConvId) conversations[id].hermesSid = null; }
        save();
      }
    } else {
      await newConversation();
    }
    if (!silent) hideLoading();
  } catch (e) {
    if (!silent) hideLoading();
    setConn('error');
    addSystemMsg('Connection failed: ' + e.message);
  }
}

function connectWS() {
  return new Promise((resolve, reject) => {
    _userDisconnect = false;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/api/ws');
    ws.onopen = () => { setConn('connected'); startHeartbeat(); };
    ws.onmessage = (e) => handleWS(JSON.parse(e.data), resolve);
    ws.onerror = () => { setConn('error'); stopHeartbeat(); reject(new Error('WS error')); };
    ws.onclose = () => {
      stopHeartbeat();
      setConn('disconnected');
      if (!_userDisconnect && brokerInfo) autoReconnect();
    };
  });
}

function handleWS(data, initResolve) {
  if (data.method === 'event') {
    const t = data.params?.type;
    const evtSid = data.params?.session_id || null;

    if (t === 'gateway.ready') { initResolve(); return; }

    if (t === 'message.start') {
      const convId = convByHermesSid(evtSid);
      if (convId) {
        streamState[convId] = { streamText: '' };
        if (convId === activeConvId) showStreamingUI();
      }
      return;
    }

    if (t === 'message.delta') {
      const convId = convByHermesSid(evtSid);
      if (convId && streamState[convId]) {
        streamState[convId].streamText += data.params?.payload?.text || '';
        if (convId === activeConvId) {
          const body = document.getElementById('streamBody');
          if (body) {
            clearTimeout(_streamRenderTimer);
            _streamRenderTimer = setTimeout(() => {
              if (body) { body.innerHTML = renderMd(streamState[convId]?.streamText || ''); addCodeCopyBtns(body.parentElement); scrollBottom(); }
            }, 120);
          }
          scrollBottom();
        }
      }
      return;
    }

    if (t === 'message.complete') {
      const convId = convByHermesSid(evtSid);
      if (convId && streamState[convId]) {
        const text = streamState[convId].streamText;
        delete streamState[convId];
        const el = document.getElementById('streamingMsg');
        if (el) {
          el.classList.remove('streaming');
          const body = el.querySelector('.msg-body');
          if (body) { body.innerHTML = renderMd(text); addCodeCopyBtns(el); }
        }

        const conv = conversations[convId];
        if (conv && text) {
          conv.messages.push({ role: 'assistant', text, ts: Date.now() });
          conv.updatedAt = Date.now();
          save();
        }
        renderSessionList();
        enableInput();
        if (conv && !conv.sessionKey) fetchSessionKey(conv.id);
        // Fetch usage after response
        if (conv?.hermesSid) fetchUsage(conv.id);
      }
      return;
    }

    if (t === 'error') {
      addSystemMsg('Error: ' + (data.params?.payload?.message || ''));
      if (evtSid) { const c = convByHermesSid(evtSid); if (c) delete streamState[c]; }
      enableInput();
      return;
    }
    if (t === 'tool.start') {
      const convId = convByHermesSid(evtSid);
      if (convId === activeConvId) {
        hideEmpty();
        const toolName = data.params?.payload?.name || 'Unknown';
        const div = document.createElement('div'); div.className = 'msg tool-running';
        div.innerHTML = `<div class="msg-body"><span class="tool-dots"><span></span><span></span><span></span></span><span>Running: <strong>${esc(toolName)}</strong></span></div>`;
        div.id = 'toolRun_' + toolName.replace(/\W/g, '_');
        $('messages').appendChild(div); scrollBottom();
        showToolThinking(toolName);
      }
      return;
    }
    if (t === 'tool.complete') {
      const convId = convByHermesSid(evtSid);
      if (convId === activeConvId) {
        const toolName = data.params?.payload?.name || '';
        const el = toolName ? document.getElementById('toolRun_' + toolName.replace(/\W/g, '_')) : null;
        if (el) {
          el.className = 'msg tool-running';
          el.querySelector('.tool-dots')?.remove();
          const label = el.querySelector('strong');
          if (label) label.parentElement.innerHTML = '<strong>' + esc(toolName) + '</strong> &#10003; Done';
          el.style.borderColor = 'var(--success)';
          el.style.background = 'linear-gradient(135deg, #f0fdf4 0%, #fefffe 100%)';
        }
      }
      return;
    }
    if (['tool.complete','session.info','thinking.delta','reasoning.delta','reasoning.available','status.update'].includes(t)) return;
  }

  // RPC responses
  if (data.id && pending[data.id]) {
    const { resolve, reject } = pending[data.id];
    delete pending[data.id];
    if (data.error) reject(new Error(data.error.message || JSON.stringify(data.error)));
    else resolve(data.result || {});
  }
}

function rpc(method, params, timeout) {
  return new Promise((resolve, reject) => {
    const id = String(++rpcId);
    pending[id] = { resolve, reject };
    const p = { jsonrpc: '2.0', id, method };
    if (params) p.params = params;
    ws.send(JSON.stringify(p));
    if (timeout) {
      setTimeout(() => {
        if (pending[id]) { delete pending[id]; reject(new Error('RPC timeout: ' + method)); }
      }, timeout);
    }
  });
}

// ── Hermes HTTP ──

async function hermesHTTP(method, path, body) {
  if (!brokerInfo) throw new Error('Not connected');
  const opts = { method, credentials: 'include' };
  if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
  const resp = await fetch(path, opts);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const text = await resp.text();
  try { return JSON.parse(text); } catch(e) { return { raw: text }; }
}

async function loadServerSessions() {
  try {
    const data = await hermesHTTP('GET', '/api/sessions');
    const serverKeys = new Set((data.sessions || []).map(s => s.id));
    const byKey = {};
    for (const c of Object.values(conversations)) { if (c.sessionKey) byKey[c.sessionKey] = c; }

    for (const s of (data.sessions || [])) {
      const local = byKey[s.id];
      if (local) {
        if (s.title && s.title !== 'New chat' && s.title !== 'Untitled') local.title = s.title;
        local._msgCount = s.message_count || 0;
      } else {
        const convId = 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        conversations[convId] = {
          id: convId, hermesSid: null, sessionKey: s.id,
          title: s.title || 'Untitled', messages: [],
          createdAt: (s.started_at||0)*1000 || Date.now(),
          updatedAt: (s.started_at||0)*1000 || Date.now(),
          _loaded: false, _msgCount: s.message_count || 0,
        };
      }
    }

    // Remove local sessions that no longer exist on server
    const toRemove = [];
    for (const [id, c] of Object.entries(conversations)) {
      if (c.sessionKey && !serverKeys.has(c.sessionKey)) toRemove.push(id);
    }
    for (const id of toRemove) delete conversations[id];

    save(); renderSessionList();
  } catch (e) { console.warn('Failed to load server sessions:', e); }
}

async function loadSessionMessages(convId) {
  const conv = conversations[convId];
  if (!conv?.sessionKey || conv._loaded) return;
  try {
    const data = await hermesHTTP('GET', '/api/sessions/' + conv.sessionKey + '/messages');
    conv.messages = (data.messages || [])
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .map(m => ({ role: m.role, text: typeof m.content === 'string' ? m.content : JSON.stringify(m.content), ts: Date.now() }));
    conv._loaded = true;
    if ((conv.title === 'Untitled' || conv.title === 'New chat') && conv.messages.length > 0) {
      const first = conv.messages.find(m => m.role === 'user');
      if (first) conv.title = first.text.slice(0, 30) + (first.text.length > 30 ? '...' : '');
    }
    save();
  } catch (e) { addSystemMsg('Failed to load history'); }
}

// ── Heartbeat & Reconnect ──

function startHeartbeat() {
  stopHeartbeat();
  _heartbeatTimer = setInterval(() => {
    if (ws?.readyState === WebSocket.OPEN) ws.send('{"jsonrpc":"2.0","method":"ping","id":"_hb"}');
  }, 30000);
}

function stopHeartbeat() { if (_heartbeatTimer) { clearInterval(_heartbeatTimer); _heartbeatTimer = null; } }

function cancelReconnect() { if (_reconnectTimer) { clearTimeout(_reconnectTimer); _reconnectTimer = null; } _reconnectAttempts = 0; }

async function autoReconnect() {
  cancelReconnect();
  if (_reconnectAttempts >= MAX_RECONNECT) { addSystemMsg('Max retries reached, please refresh'); setConn('error'); return; }
  _reconnectAttempts++;
  const delay = Math.min(3000 + 2000 * _reconnectAttempts, 30000);
  setConn('connecting');
  addSystemMsg(`Reconnecting in ${Math.round(delay/1000)}s (${_reconnectAttempts}/${MAX_RECONNECT})`);

  _reconnectTimer = setTimeout(async () => {
    try {
      let resp = await fetch('/api/sessions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}', credentials: 'include' });
      if (!resp.ok) throw new Error('Failed to reassign process');
      brokerInfo = await resp.json();
      await connectWS();
      _reconnectAttempts = 0;
      if (activeConvId && conversations[activeConvId]?.sessionKey) {
        try {
          const r = await rpc('session.resume', { session_id: conversations[activeConvId].sessionKey });
          conversations[activeConvId].hermesSid = r.session_id;
          save(); renderMessages();
          addSystemMsg('Auto-reconnected');
        } catch (e) { addSystemMsg('Failed to resume session: ' + e.message); }
      }
      enableInput();
      for (const [id, c] of Object.entries(conversations)) { if (id !== activeConvId) c.hermesSid = null; }
      save();
    } catch (e) { addSystemMsg('Reconnect failed: ' + e.message); autoReconnect(); }
  }, delay);
}

async function disconnect() {
  _userDisconnect = true;
  cancelReconnect(); stopHeartbeat();
  if (ws) { ws.close(); ws = null; }
  if (brokerInfo) {
    try {
      await fetch('/api/sessions', { method: 'DELETE', credentials: 'include' });
    } catch(e) {}
    brokerInfo = null;
  }
  streamState = {}; activeConvId = null; conversations = {};
  setConn('disconnected');
  const wScreen = $('welcomeScreen');
  if (wScreen) wScreen.style.display = 'flex';
  $('btnNewChat').style.display = 'none';
  $('sidebarFooter').style.display = 'none';
  $('sessionList').innerHTML = '<div class="session-empty">Connect to start</div>';
  $('messages').innerHTML = '<div class="empty-state" id="emptyState"><div class="logo"><svg width="48" height="48" viewBox="0 0 16 16"><path d="M8 1.5v13" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/><path d="M8 3.25c-2.35-1.4-4.7-.95-6.25.35 1.85-.2 3.8.2 5.55 1.55" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 3.25c2.35-1.4 4.7-.95 6.25.35-1.85-.2-3.8.2-5.55 1.55" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="1.8" r="1.1" fill="var(--accent)"/></svg></div><p>Connect to server to start chatting</p></div>';
  disableInput();
}

// ── Conversation management ──

async function newConversation() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    const result = await rpc('session.create', {});
    const convId = 'conv_' + Date.now();
    conversations[convId] = {
      id: convId, hermesSid: result.session_id, sessionKey: null,
      title: 'New chat', messages: [], createdAt: Date.now(), updatedAt: Date.now(),
    };
    doSwitchConv(convId);
    save(); renderSessionList(); enableInput(); $('input').focus();
    fetchSessionKey(convId);
  } catch (e) { addSystemMsg('Failed to create: ' + e.message); }
}

async function fetchSessionKey(convId) {
  const conv = conversations[convId];
  if (!conv || conv.sessionKey) return;
  try {
    const s = await rpc('session.status', { session_id: conv.hermesSid });
    const m = (s.output || '').match(/Session ID:\s*(.+)/);
    if (m?.[1]) { conv.sessionKey = m[1].trim(); save(); }
  } catch (e) {}
}

function doSwitchConv(convId) {
  activeConvId = convId;
  renderSessionList(); renderMessages(); enableInput();
}

async function switchConversation(convId) {
  if (!conversations[convId] || convId === activeConvId) return;
  closeSettings();
  const conv = conversations[convId];

  if (!conv.hermesSid && conv.sessionKey && ws?.readyState === WebSocket.OPEN) {
    try {
      const r = await rpc('session.resume', { session_id: conv.sessionKey });
      conv.hermesSid = r.session_id; save();
    } catch (e) { addSystemMsg('Cannot resume: ' + e.message); }
  }

  activeConvId = convId;
  renderSessionList();

  if (conv.messages.length === 0 && conv.sessionKey && !conv._loaded) await loadSessionMessages(convId);
  renderMessages();

  if (isConvStreaming(convId) && !document.getElementById('streamingMsg')) {
    showStreamingUI();
    const body = document.getElementById('streamBody');
    if (body) { body.innerHTML = renderMd(streamState[convId].streamText); addCodeCopyBtns(body.parentElement); }
    scrollBottom();
  }

  conv.hermesSid && !isConvStreaming(convId) ? enableInput() : disableInput();
  fetchUsage(convId);
}

async function deleteConversation(convId, event) {
  event?.stopPropagation();
  if (!conversations[convId] || isConvStreaming(convId)) return;
  const conv = conversations[convId];
  if (conv.hermesSid && ws?.readyState === WebSocket.OPEN) {
    try { await rpc('session.close', { session_id: conv.hermesSid }); } catch(e) {}
  }
  if (conv.sessionKey) { try { await hermesHTTP('DELETE', '/api/sessions/' + conv.sessionKey); } catch(e) {} }

  delete conversations[convId]; delete streamState[convId]; save();

  if (convId === activeConvId) {
    activeConvId = null;
    const rest = Object.keys(conversations);
    rest.length > 0 ? doSwitchConv(rest[rest.length-1]) : ($('messages').innerHTML = '', disableInput(), addSystemMsg('Chat deleted'));
  } else { renderSessionList(); }
}

// ── Session rename ──

function startRename(convId, event) {
  event?.stopPropagation();
  const conv = conversations[convId];
  if (!conv) return;
  const el = document.querySelector(`[data-conv-id="${convId}"] .session-title`);
  if (!el) return;
  const input = document.createElement('input');
  input.className = 'session-title-input';
  input.value = conv.title;
  el.replaceWith(input);
  input.focus(); input.select();

  const finish = async () => {
    const newTitle = input.value.trim() || conv.title;
    conv.title = newTitle; save(); renderSessionList();
    if (conv.hermesSid && ws?.readyState === WebSocket.OPEN) {
      try { await rpc('session.title', { session_id: conv.hermesSid, title: newTitle }); } catch(e) {}
    }
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = conv.title; input.blur(); } });
}

// ── Undo ──

async function undoLastTurn() {
  const conv = conversations[activeConvId];
  if (!conv?.hermesSid || isConvStreaming(activeConvId)) return;
  try {
    const result = await rpc('session.undo', { session_id: conv.hermesSid });
    if (result.undone) {
      // Remove last user + assistant message pair
      for (let i = conv.messages.length - 1; i >= 0; i--) {
        if (conv.messages[i].role === 'assistant' || conv.messages[i].role === 'user') {
          conv.messages.splice(i, 1);
          if (conv.messages[i-1]?.role === 'user') { conv.messages.splice(i-1, 1); break; }
          break;
        }
      }
      save(); renderMessages();
      addSystemMsg('Last turn undone');
    }
  } catch (e) { addSystemMsg('Undo failed: ' + e.message); }
}

async function compressConversation(convId, event) {
  event?.stopPropagation();
  const conv = conversations[convId];
  if (!conv?.hermesSid) { addSystemMsg('Please open this chat first'); return; }

    const r = await rpc('session.compress', { session_id: conv.hermesSid, strategy: 'last' });
    addSystemMsg(`Compressed: ${r.old_count || '?'} → ${r.new_count || '?'} messages`);
  } catch (e) { addSystemMsg('Compress failed: ' + e.message); }
}

// ── File upload (two-step: upload → show chip → send with message) ──

let _pendingFiles = [];  // {name, path, size, isImage}

function handleFileSelect(event) {
  const files = event.target.files;
  if (files?.length) uploadFiles(files);
  event.target.value = '';
}

function renderPendingFiles() {
  const el = $('pendingFiles');
  if (!el) return;
  if (_pendingFiles.length === 0) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  el.innerHTML = _pendingFiles.map((f, i) =>
    `<span class="pending-file"><span class="pf-name">${esc(f.name)}</span><span class="pf-remove" onclick="removePendingFile(${i})">&times;</span></span>`
  ).join('');
}

function removePendingFile(idx) {
  _pendingFiles.splice(idx, 1);
  renderPendingFiles();
}

async function uploadFiles(fileList) {
  const conv = conversations[activeConvId];
  if (!conv?.hermesSid) { addSystemMsg('Please create a chat first'); return; }
  if (!brokerInfo) { addSystemMsg('Not connected'); return; }

  for (const file of fileList) {
    addSystemMsg('Uploading ' + file.name + '\u2026');
    try {
      const formData = new FormData();
      formData.append('file', file);
      const opts = { method: 'POST', body: formData, credentials: 'include' };

      const r = await fetch('/api/upload', opts);
      if (!r.ok) throw new Error('Upload failed: HTTP ' + r.status);
      const result = await r.json();

      _pendingFiles.push({
        name: file.name,
        path: result.path,
        size: file.size,
        isImage: /\.(png|jpe?g|gif|webp|bmp|svg|tiff?)$/i.test(file.name),
      });
      renderPendingFiles();
      addSystemMsg(file.name + ' ready (' + _fmtSize(file.size) + ')');
      $('input')?.focus();
    } catch (e) {
      addSystemMsg('Upload failed (' + file.name + '): ' + e.message);
    }
  }
}

function buildFilePrompt(text) {
  if (_pendingFiles.length === 0) return text;
  const fileParts = _pendingFiles.map(f => {
    const icon = f.isImage ? '📷' : '📄';
    return icon + ' ' + f.name + ' (' + _fmtSize(f.size) + ')\nFile path: ' + f.path;
  });
  const fileSummary = _pendingFiles.length === 1
    ? 'Attached file:\n' + fileParts[0]
    : 'Attached files:\n' + fileParts.map((p,i) => (i+1) + '. ' + p).join('\n');
  return (text ? text + '\n\n' : '') + fileSummary;
}

async function attachPendingFiles(conv) {
  for (const f of _pendingFiles) {
    if (f.isImage) {
      try { await rpc('image.attach', { session_id: conv.hermesSid, path: f.path }, 10000); } catch(e) {}
    } else {
      try { await rpc('input.detect_drop', { session_id: conv.hermesSid, text: f.path }, 10000); } catch(e) {}
    }
  }
  _pendingFiles = [];
  renderPendingFiles();
}

function _fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// ── Send message ──

async function sendMessage() {
  const el = $('input');
  const text = el.value.trim();
  if ((!text && _pendingFiles.length === 0) || !ws || !activeConvId || isConvStreaming(activeConvId)) return;

  const conv = conversations[activeConvId];
  if (!conv?.hermesSid) { addSystemMsg('Session expired'); return; }

  // Build display text and prompt text BEFORE clearing pending files
  const displayText = text || '';
  const promptText = buildFilePrompt(text);
  const sentFiles = _pendingFiles.map(f => ({ name: f.name, size: f.size, isImage: f.isImage, path: f.path }));

  // Attach pending files to session context (clears _pendingFiles)
  await attachPendingFiles(conv);

  conv.messages.push({ role: 'user', text: displayText, files: sentFiles, ts: Date.now() });
  conv.updatedAt = Date.now();
  if (conv.title === 'New chat') {
    const titleText = displayText || sentFiles.map(f => f.name).join(', ');
    conv.title = titleText.slice(0, 30) + (titleText.length > 30 ? '...' : '');
    rpc('session.title', { session_id: conv.hermesSid, title: conv.title }).catch(() => {});
    renderSessionList();
  }
  save(); addUserMsg(displayText, sentFiles);
  el.value = ''; el.style.height = 'auto';
  disableInput();

  try {
    const result = await rpc('prompt.submit', { session_id: conv.hermesSid, text: promptText });
    if (result.status !== 'streaming') {
      conv.messages.push({ role: 'assistant', text: JSON.stringify(result), ts: Date.now() });
      conv.updatedAt = Date.now(); save();
      addAssistantMsg(JSON.stringify(result)); enableInput();
    }
  } catch (e) { addSystemMsg('Send failed: ' + e.message); enableInput(); }
}

// ── Rendering ──

function _timeGroup(ts) {
  const now = new Date();
  const d = new Date(ts);
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const yesterdayStart = todayStart - 86400000;
  const weekStart = todayStart - 7 * 86400000;
  if (ts >= todayStart) return 'Today';
  if (ts >= yesterdayStart) return 'Yesterday';
  if (ts >= weekStart) return 'Previous 7 Days';
  return 'Older';
}

function renderSessionList() {
  const list = $('sessionList');
  const sorted = Object.values(conversations).sort((a, b) => (b.updatedAt||0) - (a.updatedAt||0));
  if (sorted.length === 0) { list.innerHTML = '<div class="session-empty">No conversations</div>'; return; }

  const groups = [];
  const groupOrder = ['Today', 'Yesterday', 'Previous 7 Days', 'Older'];
  const groupMap = {};
  for (const c of sorted) {
    const g = _timeGroup(c.updatedAt || Date.now());
    if (!groupMap[g]) { groupMap[g] = []; groups.push(g); }
    groupMap[g].push(c);
  }

  let html = '';
  for (const g of groups) {
    html += `<div class="session-group-label">${g}</div>`;
    for (const c of groupMap[g]) {
      const active = c.id === activeConvId;
      html += `<div class="session-item${active ? ' active' : ''}" data-conv-id="${c.id}" onclick="switchConversation('${c.id}')">
        <span class="session-title">${esc(c.title)}</span>
        <span class="session-actions">
          <button class="session-action-btn" onclick="startRename('${c.id}',event)" title="Rename">&#9998;</button>
          <button class="session-action-btn" onclick="compressConversation('${c.id}',event)" title="Compress">&#128196;</button>
          <button class="session-action-btn danger" onclick="deleteConversation('${c.id}',event)" title="Delete">&times;</button>
        </span>
      </div>`;
    }
  }
  list.innerHTML = html;
}

function renderMessages() {
  const container = $('messages');
  const conv = conversations[activeConvId];
  if (!conv || conv.messages.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="logo"><svg width="48" height="48" viewBox="0 0 16 16"><path d="M8 1.5v13" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/><path d="M8 3.25c-2.35-1.4-4.7-.95-6.25.35 1.85-.2 3.8.2 5.55 1.55" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 3.25c2.35-1.4 4.7-.95 6.25.35-1.85-.2-3.8.2-5.55 1.55" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="1.8" r="1.1" fill="var(--accent)"/></svg></div><p>Start a conversation</p></div>';
    return;
  }
  container.innerHTML = '';
  for (const m of conv.messages) {
    if (m.role === 'user') _appendMsg(container, 'user', m.text, m.files);
    else if (m.role === 'assistant') _appendMsg(container, 'assistant', m.text);
  }
  scrollBottom();
}

function _appendMsg(container, role, text, files) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let inner = '';
  if (role === 'user') {
    if (files && files.length) inner += _renderAttachments(files);
    if (text) inner += `<div class="msg-body">${esc(text)}</div>`;
  } else {
    inner = `<div class="msg-body md">${renderMd(text)}</div>`;
  }
  div.innerHTML = `<div class="msg-label">${role === 'user' ? 'You' : 'Hermes'}</div>${inner}`;
  container.appendChild(div);
  if (role === 'assistant') addCodeCopyBtns(div);
}

let _streamRenderTimer = null;
function showStreamingUI() {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'msg assistant streaming'; div.id = 'streamingMsg';
  div.innerHTML = '<div class="msg-label">Hermes</div><div class="msg-body md" id="streamBody"></div>';

const _loadSteps = [
  { id: 'alloc',   text: 'Allocating process' },
  { id: 'load',    text: 'Loading sessions' },
  { id: 'ws',      text: 'Connecting WebSocket' },
  { id: 'model',   text: 'Loading model info' },
  { id: 'resume',  text: 'Resuming session' },
];
let _loadIdx = 0;

function showLoading(stepId) {
  const wScreen = $('welcomeScreen');
  const ov = $('loadingOverlay');
  if (wScreen) wScreen.style.display = 'none';
  if (ov) ov.style.display = 'flex';

  // Mark previous step as done
  if (_loadIdx > 0) {
    const prev = $('step_' + _loadSteps[_loadIdx - 1].id);
    if (prev) { prev.className = 'loading-step done'; prev.querySelector('.step-icon').innerHTML = '\u2713'; }
  }

  // Find current step
  const idx = _loadSteps.findIndex(s => s.id === stepId);
  if (idx >= 0) _loadIdx = idx + 1;

  // Build steps HTML
  const container = $('loadingSteps');
  if (container) {
    let html = '';
    for (let i = 0; i < _loadSteps.length; i++) {
      const s = _loadSteps[i];
      const isDone = i < _loadIdx - 1;
      const isActive = i === _loadIdx - 1;
      const cls = isDone ? 'done' : isActive ? 'active' : '';
      const icon = isDone ? '\u2713' : isActive ? '\u25CF' : '\u25CB';
      html += '<div class="loading-step ' + cls + '" id="step_' + s.id + '"><span class="step-icon' + (isDone ? ' check' : '') + '">' + icon + '</span>' + s.text + '</div>';
    }
    container.innerHTML = html;
  }
}

function hideLoading() {
  // Mark last step done
  if (_loadIdx > 0) {
    const last = $('step_' + _loadSteps[_loadIdx - 1].id);
    if (last && !last.classList.contains('done')) {
      last.className = 'loading-step done'; last.querySelector('.step-icon').innerHTML = '\u2713';
    }
  }
  _loadIdx = 0;
  setTimeout(() => {
    const ov = $('loadingOverlay');
    if (ov) ov.style.display = 'none';
  }, 300);
}

function setConn(state) {
  const dot = $('connDot');
  const label = $('connLabel');
  if (!dot) return;
  const header = dot.parentElement;
  const btn = $('btnConnect');
  if (state === 'connected') { dot.className = 'conn-dot ok'; if (header) header.innerHTML = '<span class="conn-dot ok" id="connDot"></span><span class="conn-label" id="connLabel">Connected</span>'; }
  else if (state === 'connecting') { if (header) header.innerHTML = '<span class="conn-dot" id="connDot"></span><span class="conn-label" id="connLabel">Connecting\u2026</span>'; if (btn) btn.disabled = true; }
  else if (state === 'error') { if (header) header.innerHTML = '<span class="conn-dot" id="connDot"></span><span class="conn-label" id="connLabel">Disconnected</span>'; if (btn) btn.disabled = false; $('welcomeScreen').style.display = 'flex'; }

let _mdReady = typeof marked !== 'undefined';
if (_mdReady) {
  marked.setOptions({
    highlight: function(code, lang) {
      if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
      }
      if (typeof hljs !== 'undefined') { try { return hljs.highlightAuto(code).value; } catch(e) {} }
      return code;
    },
    breaks: true,
    gfm: true,
  });
}

function renderMd(text) {
  if (!_mdReady) return esc(text);
  try { return marked.parse(text); } catch(e) { return esc(text); }
}

function addCodeCopyBtns(container) {
  container.querySelectorAll('pre code').forEach(codeEl => {
    const pre = codeEl.parentElement;
    if (!pre || pre.querySelector('.md-code-copy')) return;
    const btn = document.createElement('button');
    btn.className = 'md-code-copy';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      navigator.clipboard.writeText(codeEl.textContent).then(() => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1500); });
    };
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });
}

async function loadSettingsUsage() {
  const body = $('settingsBody');
  try {
    const data = await hermesHTTP('GET', '/api/analytics/usage?days=30');
    const entries = data.usage || data.daily || data.entries || [];
    let totalIn = 0, totalOut = 0, totalCost = 0;
    if (Array.isArray(entries)) {
      for (const e of entries) {
        totalIn += e.input_tokens || 0;
        totalOut += e.output_tokens || 0;
        totalCost += parseFloat(e.estimated_cost_usd || 0);
      }
    }

    // Build SVG bar chart
    let chartSvg = '';
    if (Array.isArray(entries) && entries.length > 0) {
      const maxVal = Math.max(...entries.map(e => (e.input_tokens||0) + (e.output_tokens||0)), 1);
      const barW = Math.max(Math.min(400 / entries.length, 20), 4);
      const chartW = entries.length * barW;
      const chartH = 120;
      let bars = '';
      entries.forEach((e, i) => {
        const inH = Math.round((e.input_tokens||0) / maxVal * chartH);
        const outH = Math.round((e.output_tokens||0) / maxVal * chartH);
        const x = i * barW;
        bars += `<rect x="${x}" y="${chartH - inH - outH}" width="${barW-1}" height="${inH}" fill="var(--accent)" rx="1"/>`;
        if (outH > 0) bars += `<rect x="${x}" y="${chartH - outH}" width="${barW-1}" height="${outH}" fill="var(--accent-dim)" rx="1"/>`;
      });
      chartSvg = `<div class="s-card"><div class="s-card-title">Token Usage (30 Days)</div>
        <svg class="usage-chart" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none">${bars}</svg>
        <div class="chart-legend"><span><span class="legend-dot" style="background:var(--accent)"></span>Input</span><span><span class="legend-dot" style="background:var(--accent-dim)"></span>Output</span></div>
      </div>`;
    }

    // Detail rows in reverse order (newest first)
    let detailRows = '';
    if (Array.isArray(entries)) {
      const reversed = [...entries].reverse();
      for (const e of reversed) {
        detailRows += `<tr>
          <td>${esc(e.date || e.day || '-')}</td>
          <td>${fmtTokens(e.input_tokens || 0)}</td>
          <td>${fmtTokens(e.output_tokens || 0)}</td>
          <td>${e.sessions || e.session_count || '-'}</td>
          <td>$${(parseFloat(e.estimated_cost_usd || 0)).toFixed(4)}</td>
        </tr>`;
      }
    }

    body.innerHTML = `
      ${chartSvg}
      <div class="s-card">
        <div class="s-card-title">30-Day Summary</div>
        <div class="s-row"><span class="s-row-label">Input Tokens</span><span class="s-row-value">${fmtTokens(totalIn)}</span></div>
        <div class="s-row"><span class="s-row-label">Output Tokens</span><span class="s-row-value">${fmtTokens(totalOut)}</span></div>
        <div class="s-row"><span class="s-row-label">Estimated Cost</span><span class="s-row-value">$${totalCost.toFixed(4)}</span></div>
      </div>
      ${detailRows ? `<div class="s-card">
        <div class="s-card-title">Daily Breakdown</div>
        <table class="usage-table"><tr><th>Date</th><th>Input</th><th>Output</th><th>Sessions</th><th>Cost</th></tr>${detailRows}</table>
      </div>` : ''}`;
  } catch(e) {
    body.innerHTML = '<div style="color:var(--danger);padding:20px">Load failed: ' + esc(e.message) + '</div>';
  }
}

function humanizeSchedule(s) {
  if (!s) return '-';
  if (typeof s !== 'string') s = String(s);
  const p = s.trim().split(/\s+/);
  if (p.length !== 5) return s;
  const [min, hour, dom, mon, dow] = p;
  const days = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  // Every N minutes
  if (min.startsWith('*/') && hour === '*' && dom === '*' && mon === '*' && dow === '*') return 'Every ' + min.slice(2) + ' min';
  // Hourly
  if (min !== '*' && hour === '*' && dom === '*' && mon === '*' && dow === '*') return 'Hourly at :' + min.padStart(2, '0');
  // Every N hours
  if (min !== '*' && hour.startsWith('*/') && dom === '*' && mon === '*' && dow === '*') return 'Every ' + hour.slice(2) + ' hours at :' + min.padStart(2, '0');
  // Daily
  if (min !== '*' && hour !== '*' && dom === '*' && mon === '*' && dow === '*') return 'Daily at ' + hour.padStart(2, '0') + ':' + min.padStart(2, '0');
  // Weekly
  if (min !== '*' && hour !== '*' && dom === '*' && mon === '*' && dow !== '*') {
    const dName = dow.startsWith('*/') ? 'every ' + dow.slice(2) + ' days' : (days[parseInt(dow)] || dow);
    return dName + ' at ' + hour.padStart(2, '0') + ':' + min.padStart(2, '0');
  }
  return s;
}

              ? `<button class="cron-btn" onclick="cronAction('${esc(j.id)}','resume')">Resume</button>`
              : `<button class="cron-btn" onclick="cronAction('${esc(j.id)}','pause')">Pause</button>`}
            <button class="cron-btn" onclick="cronAction('${esc(j.id)}','trigger')">Trigger</button>
            <button class="cron-btn danger" onclick="cronAction('${esc(j.id)}','delete')">Delete</button>
          </div>
        </div>
        <div class="cron-schedule">${esc(humanizeSchedule(j.schedule || j.cron))}</div>
        <div class="cron-prompt">${esc(j.prompt || '')}</div>
      </div>`;
    }
    if (jobs.length === 0) html += '<div class="s-empty">No scheduled tasks</div>';
    html += '</div>';
    body.innerHTML = html;
  } catch(e) {
    body.innerHTML = '<div style="color:var(--danger);padding:20px">Load failed: ' + esc(e.message) + '</div>';
  }
}

async function settingsSwitchModel(val) {
  try {
    const [provider, model] = val.split('|');
    await hermesHTTP('POST', '/api/model/set', { scope: 'main', provider, model });
    currentModel = model;
    addSystemMsg('Model switched to ' + model);
    loadSettingsModel();
  } catch (e) {
    addSystemMsg('Switch failed: ' + e.message);
  }
}

function toggleCustomModelForm() {
  const form = $('customModelForm');
  const icon = $('cmToggleIcon');
  if (!form) return;
  const open = form.style.display !== 'none';
  form.style.display = open ? 'none' : 'block';
  if (icon) icon.style.transform = open ? '' : 'rotate(90deg)';
}

async function addCustomModel() {
  const name = $('cmName')?.value?.trim();
  const baseUrl = $('cmBaseUrl')?.value?.trim();
  const apiKey = $('cmApiKey')?.value?.trim();
  const model = $('cmModel')?.value?.trim();
  const apiMode = $('cmApiMode')?.value || '';
  const contextLen = parseInt($('cmContext')?.value || '0') || 0;
  const msg = $('cmMsg');

  if (!name || !baseUrl || !model) {
    if (msg) { msg.style.display = 'block'; msg.style.color = 'var(--danger)'; msg.textContent = 'Provider Name, Base URL, and Model Name are required.'; }
    return;
  }

  if (msg) { msg.style.display = 'block'; msg.style.color = 'var(--text-dim)'; msg.textContent = 'Saving\u2026'; }

  try {
    // Read current config
    const cfg = await hermesHTTP('GET', '/api/config');
    let providers = cfg.custom_providers || [];
    if (!Array.isArray(providers)) providers = [];

    // Build entry
    const entry = { name, base_url: baseUrl, model };
    if (apiKey) entry.api_key = apiKey;
    if (apiMode) entry.api_mode = apiMode;
    if (contextLen > 0) entry.models = { [model]: { context_length: contextLen } };

    // Check for duplicate by base_url — update if exists
    let updated = false;
    for (let i = 0; i < providers.length; i++) {
      if (providers[i].base_url?.replace(/\/+$/, '') === baseUrl.replace(/\/+$/, '')) {
        providers[i] = { ...providers[i], ...entry };
        updated = true;
        break;
      }
    }
    if (!updated) providers.push(entry);

    cfg.custom_providers = providers;
    await hermesHTTP('PUT', '/api/config', { config: cfg });

    if (msg) { msg.style.color = 'var(--success)'; msg.textContent = 'Custom model "' + name + '" saved. It will appear in the model dropdown above.'; }
    addSystemMsg('Custom model "' + name + '" added successfully');

    // Clear form
    const fields = ['cmName', 'cmBaseUrl', 'cmApiKey', 'cmModel'];
    fields.forEach(id => { const el = $(id); if (el) el.value = ''; });
    const ctxEl = $('cmContext'); if (ctxEl) ctxEl.value = '0';
    const modeEl = $('cmApiMode'); if (modeEl) modeEl.selectedIndex = 0;

    // Refresh model dropdown
    setTimeout(() => loadSettingsModel(), 500);
  } catch (e) {
    if (msg) { msg.style.color = 'var(--danger)'; msg.textContent = 'Failed: ' + e.message; }
    addSystemMsg('Add custom model failed: ' + e.message);
  }
}

async function toggleSkill(name, enabled) {
  try {
    await hermesHTTP('PUT', '/api/skills/toggle', { name, enabled });
  } catch (e) {
    addSystemMsg('Toggle failed: ' + e.message);
  }
}

async function deleteSkill(name) {
  if (!confirm('Delete skill "' + name + '"?')) return;
  try {
    await hermesHTTP('DELETE', '/api/skills/' + encodeURIComponent(name));
    addSystemMsg('Skill deleted: ' + name);
    loadSettingsSkills();
  } catch (e) {
    addSystemMsg('Delete failed: ' + e.message);
  }
}

function filterInstalledSkills() {
  const q = ($('installedSkillFilter')?.value || '').toLowerCase().trim();
  const items = document.querySelectorAll('#installedSkillList .skill-item');
  for (const el of items) {
    if (!q) { el.style.display = ''; continue; }
    const name = el.dataset.skillName || '';
    const desc = el.dataset.skillDesc || '';
    el.style.display = (name.includes(q) || desc.includes(q)) ? '' : 'none';
  }
}

async function searchSkills() {
  const q = $('skillSearchInput')?.value?.trim();
  const area = $('skillSearchResults');
  if (!q) { if (area) area.innerHTML = '<div class="s-empty">Enter a keyword to search</div>'; return; }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    if (area) area.innerHTML = '<div class="s-empty" style="color:var(--danger)">WebSocket not connected</div>';
    return;
  }
  if (area) area.innerHTML = '<div class="s-empty">Searching for "' + esc(q) + '"\u2026</div>';
  try {
    // Get installed skills for comparison
    const installed = new Set();
    try {
      const sk = await hermesHTTP('GET', '/api/skills');
      const list = Array.isArray(sk) ? sk : (sk.skills || []);
      for (const s of list) installed.add(s.name);
    } catch(e) {}

    const r = await rpc('skills.manage', { action: 'search', query: q }, 10000);
    const results = r.results || [];
    let html = '';
    if (results.length === 0) {
      html = '<div class="s-empty">No results for "' + esc(q) + '"</div>';
    } else {
      html += '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">' + results.length + ' results</div>';
      for (const s of results) {
        const isInstalled = installed.has(s.name);
        html += `<div class="skill-item" ${isInstalled ? 'style="background:var(--bg)"' : ''}>
          <div class="skill-info" onclick="inspectSkill('${esc(s.name)}')"><div class="skill-name">${esc(s.name)}${isInstalled ? ' <span style="font-size:11px;color:var(--success)">\u2713 Installed</span>' : ''}</div><div class="skill-desc">${esc(s.description || '')}</div></div>
          ${isInstalled
            ? '<span style="font-size:12px;color:var(--success);white-space:nowrap">Installed</span>'
            : '<button class="cron-btn" style="border-color:var(--accent);color:var(--accent)" onclick="event.stopPropagation();installSkillByName(\'' + esc(s.name) + '\')">Install</button>'}
        </div>`;
      }
    }
    if (area) area.innerHTML = html;
  } catch (e) {
    if (area) area.innerHTML = '<div class="s-empty" style="color:var(--danger)">Search failed: ' + esc(e.message) + '</div>';
  }
}

async function installSkill() {
  const q = $('skillInstallInput')?.value?.trim();
  if (q) await installSkillByName(q);
}

async function inspectSkill(name) {
  const modal = $('skillDetailModal');
  if (!modal) return;
  modal.innerHTML = '<div class="skill-detail" onclick="if(event.target===this)this.remove()"><div class="skill-detail-card" style="position:relative"><div style="text-align:center;padding:30px;color:var(--text-dim)">Loading...</div></div></div>';
  try {
    const r = await rpc('skills.manage', { action: 'inspect', query: name }, 8000);
    const info = r.info || r;
    const author = esc(info.author || info.maintainer || '');
    const desc = esc(info.description || '');
    const readme = esc(info.readme || info.long_description || '');
    const tags = info.tags || info.categories || [];
    const version = esc(info.version || '');
    const homepage = info.homepage || info.url || '';
    let html = '<div class="skill-detail" onclick="if(event.target===this)this.remove()"><div class="skill-detail-card" style="position:relative">';
    html += '<button class="sd-close" onclick="this.closest(\'.skill-detail\').remove()">\u2715</button>';
    html += '<h2>' + esc(name) + '</h2>';
    if (version) html += '<span class="sd-tag" style="margin-bottom:12px">v' + version + '</span> ';
    if (author) html += '<div class="sd-author">by ' + author + '</div>';
    else html += '<div style="height:8px"></div>';
    if (desc) html += '<div class="sd-section"><div class="sd-label">Description</div><div class="sd-text">' + desc + '</div></div>';
    if (readme && readme !== desc) html += '<div class="sd-section"><div class="sd-label">README</div><div class="sd-text" style="max-height:200px;overflow-y:auto">' + readme + '</div></div>';
    if (tags.length > 0) {
      html += '<div class="sd-section"><div class="sd-label">Tags</div><div class="sd-tags">';
      for (const t of tags) html += '<span class="sd-tag">' + esc(typeof t === 'string' ? t : t.name || '') + '</span>';
      html += '</div></div>';
    }
    if (homepage) html += '<div class="sd-section"><div class="sd-label">Homepage</div><a href="' + esc(homepage) + '" target="_blank" style="font-size:13px;color:var(--accent);word-break:break-all">' + esc(homepage) + '</a></div>';
    html += '<div class="sd-actions"><button class="btn btn-primary" onclick="installSkillByName(\'' + esc(name) + '\');this.closest(\'.skill-detail\').remove()">Install</button>';
    html += '<button class="btn" onclick="this.closest(\'.skill-detail\').remove()">Close</button></div>';
    html += '</div></div>';
    modal.innerHTML = html;
  } catch (e) {
    modal.innerHTML = '<div class="skill-detail" onclick="if(event.target===this)this.remove()"><div class="skill-detail-card"><div style="color:var(--danger);padding:20px">Failed to load: ' + esc(e.message) + '</div><button class="btn" onclick="this.closest(\'.skill-detail\').remove()">Close</button></div></div>';
  }
}

async function installSkillByName(name) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addSystemMsg('WS not connected'); return;
  }
  // Find the clicked button and show loading state
  const btns = document.querySelectorAll('.cron-btn, .btn-primary');
  let btn = null;
  for (const b of btns) {
    if (b.textContent.trim() === 'Install' && b.closest('.skill-item, .sd-actions')) { btn = b; break; }
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Installing...'; }
  try {
    const r = await rpc('skills.manage', { action: 'install', query: name }, 30000);
    addSystemMsg('Skill installed: ' + (r.name || name));
    loadSettingsSkills(r.name || name);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Install'; }
    addSystemMsg('Install failed: ' + e.message);
  }
}

async function uploadSkillZip(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  event.target.value = '';
  const msg = $('skillUploadMsg');
  if (msg) { msg.style.color = 'var(--text-dim)'; msg.textContent = 'Uploading\u2026'; }
  try {
    const formData = new FormData();
    formData.append('file', file);
    const r = await fetch('/api/skills/upload', { method: 'POST', body: formData, credentials: 'include' });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || 'Upload failed');
    }
    const result = await r.json();
    if (msg) { msg.style.color = 'var(--success)'; msg.textContent = result.name + ' installed'; }
    addSystemMsg('Skill installed: ' + result.name);
    loadSettingsSkills(result.name);
  } catch (e) {
    if (msg) { msg.style.color = 'var(--danger)'; msg.textContent = e.message; }
    addSystemMsg('Skill upload failed: ' + e.message);
  }
}

let _cronFreq = 'daily';
function showCronForm() {
  _cronFreq = 'daily';
  $('cronFormArea').innerHTML = `
    <div class="cron-form">
      <input id="cronName" placeholder="Task name">
      <label style="font-size:11px;color:var(--text-dim)">Frequency</label>
      <div class="cron-freq-btns">
        <button class="cron-freq-btn active" onclick="setCronFreq('every-n-min',this)">Every N min</button>
        <button class="cron-freq-btn" onclick="setCronFreq('hourly',this)">Hourly</button>
        <button class="cron-freq-btn" onclick="setCronFreq('daily',this)">Daily</button>
        <button class="cron-freq-btn" onclick="setCronFreq('weekly',this)">Weekly</button>
        <button class="cron-freq-btn" onclick="setCronFreq('custom',this)">Custom</button>
      </div>
      <div id="cronFreqFields"></div>
      <label style="font-size:11px;color:var(--text-dim)">Prompt</label>
      <textarea id="cronPrompt" placeholder="What should Hermes do? e.g. Summarize today's key news about AI"></textarea>
      <div style="font-size:11px;color:var(--text-dim)" id="cronPreview"></div>
      <div class="cron-form-actions">
        <button class="btn btn-primary" onclick="createCronJob()">Create</button>
        <button class="btn" style="background:var(--border)" onclick="$('cronFormArea').innerHTML=''">Cancel</button>
      </div>
    </div>`;
  setCronFreq('daily');
}

function setCronFreq(freq, btn) {
  _cronFreq = freq;
  document.querySelectorAll('.cron-freq-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector('.cron-freq-btn.active')?.classList.remove('active');
  // Re-highlight the right button if called without btn (init)
  if (!btn) {
    document.querySelectorAll('.cron-freq-btn').forEach(b => {
      if (b.textContent.toLowerCase().replace(/\s/g,'-').includes(freq)) b.classList.add('active');
    });
  }
  const area = $('cronFreqFields');
  if (!area) return;
  if (freq === 'every-n-min') {
    area.innerHTML = `<div class="cron-row"><label style="font-size:12px;flex:none;margin-right:4px">Every</label><input id="cronNMin" type="number" min="1" value="30" style="max-width:80px" oninput="updateCronPreview()"><label style="font-size:12px;flex:none">minutes</label></div>`;
  } else if (freq === 'hourly') {
    area.innerHTML = `<div class="cron-row"><label style="font-size:12px;flex:none;margin-right:4px">At minute</label><input id="cronHMin" type="number" min="0" max="59" value="0" style="max-width:80px" oninput="updateCronPreview()"></div>`;
  } else if (freq === 'daily') {
    area.innerHTML = `<div class="cron-row"><input id="cronDTime" type="time" value="09:00" oninput="updateCronPreview()"></div>`;
  } else if (freq === 'weekly') {
    area.innerHTML = `<div class="cron-row"><select id="cronWDay"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="0">Sunday</option></select><input id="cronWTime" type="time" value="09:00" oninput="updateCronPreview()"></div>`;
  } else {
    area.innerHTML = `<input id="cronCronExpr" placeholder="Cron expression (e.g. */15 * * * *)" oninput="updateCronPreview()">`;
  }
  updateCronPreview();
}

function buildCronExpr() {
  if (_cronFreq === 'every-n-min') {
    const n = parseInt($('cronNMin')?.value) || 30;
    return `*/${n} * * * *`;
  }
  if (_cronFreq === 'hourly') {
    const m = parseInt($('cronHMin')?.value) || 0;
    return `${m} * * * *`;
  }
  if (_cronFreq === 'daily') {
    const t = ($('cronDTime')?.value || '09:00').split(':');
    return `${parseInt(t[1])||0} ${parseInt(t[0])||9} * * *`;
  }
  if (_cronFreq === 'weekly') {
    const d = $('cronWDay')?.value || '1';
    const t = ($('cronWTime')?.value || '09:00').split(':');
    return `${parseInt(t[1])||0} ${parseInt(t[0])||9} * * ${d}`;
  }
  return $('cronCronExpr')?.value?.trim() || '';
}

function updateCronPreview() {
  const el = $('cronPreview');
  if (!el) return;
  const expr = buildCronExpr();
  el.textContent = expr ? humanizeSchedule(expr) + '  (' + expr + ')' : '';
}

async function createCronJob() {
  const name = $('cronName')?.value?.trim() || 'Untitled';
  const prompt = $('cronPrompt')?.value?.trim();
  const schedule = buildCronExpr();
  if (!schedule) { addSystemMsg('Please set a schedule'); return; }
  if (!prompt) { addSystemMsg('Please enter a prompt'); return; }
  try {
    await hermesHTTP('POST', '/api/cron/jobs', { name, schedule, prompt });
    addSystemMsg('Scheduled task created');
    loadSettingsCron();
  } catch (e) { addSystemMsg('Failed to create: ' + e.message); }
}

async function cronAction(id, action) {
  try {
    if (action === 'delete') {
      await hermesHTTP('DELETE', '/api/cron/jobs/' + id);
      addSystemMsg('Task deleted');
    } else {
      await hermesHTTP('POST', '/api/cron/jobs/' + id + '/' + action);
      addSystemMsg('Task ' + ({pause:'paused',resume:'resumed',trigger:'triggered'}[action] || action));
    }
    loadSettingsCron();
  } catch (e) { addSystemMsg('Action failed: ' + e.message); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('settingsCol').style.display !== 'none') closeSettings(); });

// ── Init: detect auth mode, auto-connect ──
(async function() {
  const user = await detectAuthMode();
  if (_oauthMode) {
    // Show GitHub button, hide legacy form
    const oauth = $('oauthSection'); if (oauth) oauth.style.display = '';
    const legacy = $('legacySection'); if (legacy) legacy.style.display = 'none';
    if (user) {
      // Already logged in — silent reconnect, skip loading overlay
      const ws = $('welcomeScreen'); if (ws) ws.style.display = 'none';
      connect(user.sub, true);
    }
  } else {
    // Legacy mode — show username form
    const oauth = $('oauthSection'); if (oauth) oauth.style.display = 'none';
    const legacy = $('legacySection'); if (legacy) legacy.style.display = '';
    const saved = localStorage.getItem('hermes_last_uid');
    if (saved) { const el = $('userId'); if (el) el.value = saved; }
    const uidInput = $('userId');
    if (uidInput) uidInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) connect(); });
  }
})();

// ── Intercept F5/Ctrl+R: refresh session list only, skip full reload ──
(function() {
  async function refreshSessionList() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return; // not connected, allow normal reload
    try { await loadServerSessions(); } catch(e) {}
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.metaKey && e.key === 'r')) {
      e.preventDefault();
      refreshSessionList();
    }
  });
})();

// Save username on connect (legacy mode only)
(function() {
  const _orig = connect;
  connect = async function(uid, silent) {
    if (!_oauthMode) {
      const u = uid || $('userId')?.value?.trim();
      if (u) localStorage.setItem('hermes_last_uid', u);
    }
    await _orig(uid, silent);
  };
})();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f7f7f7;
  --sidebar: #ffffff;
  --chat-bg: #ffffff;
  --user-bubble: #e3e3e3;
  --assistant-bubble: #ffffff;
  --accent: #d97757;
  --accent-hover: #c5623f;
  --text: #1a1a1a;
  --text-dim: #8b8b8b;
  --border: #e5e5e5;
  --danger: #ef4444;
  --success: #22c55e;
  --hover: #f0f0f0;
  --code-bg: #f4f4f4;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
}

/* ── Sidebar ── */
.sidebar {
  width: 260px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h2 {
  font-size: 15px;
  font-weight: 600;
}

.conn-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--danger);
  display: inline-block;
  margin-right: 6px;
}

.conn-dot.ok { background: var(--success); }

.conn-label { font-size: 11px; color: var(--text-dim); }

.btn-new-chat {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
}

.btn-new-chat:hover { background: var(--hover); }

.sidebar-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-section label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: block;
  margin-bottom: 6px;
}

.sidebar-section input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}

.sidebar-section input:focus { border-color: var(--accent); }

.btn {
  width: 100%;
  padding: 9px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-danger-sm {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  padding: 6px 0;
  width: 100%;
  text-align: left;
}

.btn-danger-sm:hover { color: var(--danger); }

/* ── Session list ── */
.session-list {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.session-list::-webkit-scrollbar { width: 4px; }
.session-list::-webkit-scrollbar-track { background: transparent; }
.session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.session-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.1s;
  gap: 8px;
  position: relative;
}

.session-item:hover { background: var(--hover); }

.session-item.active {
  background: var(--hover);
}

.session-item .session-title {
  flex: 1;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.session-item .session-title-input {
  flex: 1;
  font-size: 13px;
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 2px 6px;
  outline: none;
  background: #fff;
  min-width: 0;
}

.session-item .session-actions {
  display: none;
  gap: 2px;
  flex-shrink: 0;
}

.session-item:hover .session-actions { display: flex; }

.session-action-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
  border-radius: 4px;
  line-height: 1;
}

.session-action-btn:hover { background: var(--border); color: var(--text); }
.session-action-btn.danger:hover { color: var(--danger); }

.session-group-label {
  padding: 10px 16px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  user-select: none;
}

.session-empty {
  padding: 24px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
}

/* ── Sidebar footer ── */
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

/* ── Main area (chat + settings split) ── */
.main {
  flex: 1;
  display: flex;
  min-width: 0;
}

.chat-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--chat-bg);
}

.settings-col {
  width: 480px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--sidebar);
  overflow: hidden;
}

/* ── Messages ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: var(--text-dim);
}

.empty-state .logo { font-size: 48px; opacity: 0.3; }
.empty-state p { font-size: 14px; }

.msg {
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding: 16px 24px;
}

.msg-label {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-dim);
}

.msg-body {
  font-size: 15px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.user { background: var(--bg); }
.msg.user .msg-body { background: var(--user-bubble); border-radius: 18px; padding: 10px 16px; display: inline-block; max-width: 85%; }

.msg.assistant .msg-body { padding: 0; }
.msg.system .msg-body { font-size: 12px; color: var(--text-dim); font-style: italic; }

.msg.streaming .msg-body::after {
  content: '\25CC';
  animation: blink 1s infinite;
  color: var(--text-dim);
}

.msg-usage {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
}

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* ── Input area ── */
.input-area {
  padding: 16px 24px 24px;
}

.input-wrap {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  gap: 6px;
  align-items: flex-end;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 6px 6px 4px;
  transition: border-color 0.15s;
}

.input-wrap:focus-within { border-color: var(--accent); }

.input-wrap.dragover { border-color: var(--accent); background: #fdf0ec; }

.input-wrap textarea {
  flex: 1;
  background: transparent;
  border: none;
  padding: 6px 10px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  min-height: 28px;
  max-height: 160px;
  line-height: 1.5;
}

.input-wrap textarea::placeholder { color: var(--text-dim); }

.btn-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}

.btn-icon:hover { background: var(--border); color: var(--text); }
.btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-icon.send {
  background: var(--accent);
  color: #fff;
}

.btn-icon.send:hover { background: var(--accent-hover); }
.btn-icon.send:disabled { background: var(--border); color: var(--text-dim); }

/* ── Hidden file input ── */
.file-input { display: none; }

/* ── Settings panel (inline split) ── */
.settings-header {
  padding: 20px 24px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.settings-header h3 { font-size: 18px; font-weight: 600; }
.settings-close {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: none; color: var(--text-dim); font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.settings-close:hover { background: var(--hover); color: var(--text); }

.settings-body {
  flex: 1; overflow-y: auto; padding: 20px 24px 40px;
}
.settings-body::-webkit-scrollbar { width: 4px; }
.settings-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.settings-loading {
  display: flex; justify-content: center; padding: 60px 0; color: var(--text-dim); font-size: 14px;
}

.s-card {
  background: var(--bg); border-radius: 12px;
  padding: 20px; margin-bottom: 16px;
}
.s-card:last-child { margin-bottom: 0; }
.s-card-title {
  font-size: 14px; font-weight: 600; margin-bottom: 14px;
  color: var(--text);
}
.s-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
.s-row + .s-row { border-top: 1px solid var(--border); }
.s-row-label { font-size: 13px; color: var(--text); }
.s-row-value { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.s-select {
  background: var(--sidebar); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; color: var(--text); outline: none;
  cursor: pointer; min-width: 200px;
}
.s-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,119,87,0.15); }

.usage-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
.usage-table th { text-align: left; padding: 8px 10px; font-weight: 600; color: var(--text-dim); border-bottom: 1px solid var(--border); font-size: 11px; }
.usage-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }

.skill-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
.skill-info { flex: 1; min-width: 0; }
.skill-name { font-size: 13px; font-weight: 500; }
.skill-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.toggle input { display: none; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 10px; cursor: pointer; transition: background 0.2s; }
.toggle-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

.cron-item { background: var(--sidebar); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.cron-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.cron-name { font-size: 13px; font-weight: 500; }
.cron-schedule { font-size: 11px; color: var(--text-dim); }
.cron-prompt { font-size: 12px; color: var(--text-dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cron-actions { display: flex; gap: 4px; }
.cron-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; color: var(--text-dim); transition: all 0.1s; }
.cron-btn:hover { border-color: var(--accent); color: var(--accent); }
.cron-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

.cron-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding: 14px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 10px; }
.cron-form input, .cron-form select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; }
.cron-form input:focus { border-color: var(--accent); }
.cron-form-actions { display: flex; gap: 8px; margin-top: 4px; }
.cron-form-actions .btn { flex: 1; }

.skill-search { display: flex; gap: 6px; margin-bottom: 10px; }
.skill-search input { flex: 1; background: var(--sidebar); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; }
.skill-search input:focus { border-color: var(--accent); }
.skill-search button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; }
.skill-search button:hover { background: var(--accent-hover); }

.s-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 16px 0; }

/* Footer user */
.footer-user { display: flex; align-items: center; gap: 8px; }
.user-avatar { width: 28px; height: 28px; background: var(--accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.user-name { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-icon-sm { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--text-dim); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-icon-sm:hover { background: var(--hover); color: var(--text); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { width: 200px; }
  .msg { padding: 12px 16px; }
  .settings-col { width: 320px; }
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>Hermes</h2>
    <button class="btn-new-chat" id="btnNewChat" onclick="newConversation()" style="display:none">+ 新会话</button>
  </div>

  <div class="sidebar-section" id="loginSection">
    <label>服务器</label>
    <input id="brokerUrl" value="https://huzhongxiang.cloud" placeholder="https://host:port">
    <div style="margin-top:8px">
      <label>用户</label>
      <input id="userId" value="" placeholder="输入用户名">
    </div>
    <div style="margin-top:10px">
      <button class="btn btn-primary" id="btnConnect" onclick="connect()">连接</button>
    </div>
  </div>

  <div class="session-list" id="sessionList">
    <div class="session-empty" id="sessionEmpty">连接后显示会话</div>
  </div>

  <div class="sidebar-footer" id="sidebarFooter" style="display:none">
    <div class="footer-user">
      <span class="user-avatar" id="userAvatar"></span>
      <span class="user-name" id="footerUserName"></span>
      <button class="btn-icon-sm" onclick="openSettings()" title="设置">&#9881;</button>
      <button class="btn-icon-sm" onclick="disconnect()" title="断开连接" style="margin-left:-2px">&#x23FB;</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="chat-col">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="logo">&#9889;</div>
        <p>连接服务器开始对话</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-wrap" id="inputWrap">
        <input type="file" class="file-input" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        <button class="btn-icon" id="attachBtn" onclick="$('fileInput').click()" disabled title="上传图片">&#128206;</button>
        <textarea id="input" placeholder="输入消息…" rows="1" disabled></textarea>
        <button class="btn-icon" id="undoBtn" onclick="undoLastTurn()" disabled title="撤销上一轮">&#8617;</button>
        <button class="btn-icon send" id="sendBtn" onclick="sendMessage()" disabled title="发送">&#10148;</button>
      </div>
    </div>
  </div>
  <div class="settings-col" id="settingsCol" style="display:none">
    <div class="settings-header">
      <h3>Settings</h3>
      <button class="settings-close" onclick="closeSettings()">&#10005;</button>
    </div>
    <div class="settings-body" id="settingsBody">
      <div class="settings-loading">加载中…</div>
    </div>
  </div>
</div>

<script>
// ── State ──
let ws = null;
let brokerInfo = null;
let rpcId = 0;
let pending = {};
let activeConvId = null;
let streamState = {};
let _heartbeatTimer = null;
let _reconnectTimer = null;
let _userDisconnect = false;
let _reconnectAttempts = 0;
const MAX_RECONNECT = 10;
let conversations = {};
let currentModel = '';

const $ = id => document.getElementById(id);

// ── LocalStorage ──
function storageKey(uid) { return 'hermes_chat_' + uid; }

function save() {
  const uid = $('userId').value.trim();
  if (!uid) return;
  const out = {};
  for (const [id, c] of Object.entries(conversations)) {
    out[id] = { id: c.id, hermesSid: c.hermesSid, sessionKey: c.sessionKey,
                title: c.title, messages: c.messages,
                createdAt: c.createdAt, updatedAt: c.updatedAt };
  }
  localStorage.setItem(storageKey(uid), JSON.stringify(out));
}

function load(uid) {
  conversations = {};
  const raw = uid && localStorage.getItem(storageKey(uid));
  if (raw) { try { conversations = JSON.parse(raw); } catch(e) {} }
}

function convByHermesSid(sid) {
  for (const [id, c] of Object.entries(conversations)) {
    if (c.hermesSid === sid) return id;
  }
  return null;
}

function isConvStreaming(id) { return !!streamState[id]; }

// ── Textarea ──
$('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Drag & drop ──
const inputWrap = $('inputWrap');
inputWrap.addEventListener('dragover', e => { e.preventDefault(); inputWrap.classList.add('dragover'); });
inputWrap.addEventListener('dragleave', () => inputWrap.classList.remove('dragover'));
inputWrap.addEventListener('drop', e => {
  e.preventDefault();
  inputWrap.classList.remove('dragover');
  const file = e.dataTransfer?.files?.[0];
  if (file && file.type.startsWith('image/')) attachImage(file);
});

// ── Connect ──

async function connect() {
  const url = $('brokerUrl').value.replace(/\/+$/, '');
  const uid = $('userId').value.trim();
  if (!uid) { alert('请输入用户名'); return; }

  setConn('connecting');

  try {
    let resp = await fetch(url + '/broker/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: uid })
    });
    if (resp.ok) {
      brokerInfo = await resp.json();
    } else {
      resp = await fetch(url + '/broker/sessions/' + uid);
      if (!resp.ok) throw new Error('分配进程失败');
      brokerInfo = await resp.json();
    }

    load(uid);
    await loadServerSessions();
    await connectWS(brokerInfo.ws_url);
    await loadModelInfo();

    $('loginSection').style.display = 'none';
    $('btnNewChat').style.display = '';
    $('sidebarFooter').style.display = '';
    $('footerUserName').textContent = uid;
    $('userAvatar').textContent = uid.charAt(0).toUpperCase();

    // Resume or create
    const ids = Object.keys(conversations)
      .sort((a, b) => (conversations[b].updatedAt||0) - (conversations[a].updatedAt||0));
    if (ids.length > 0) {
      let resumed = false;
      for (const id of ids) {
        const conv = conversations[id];
        if (conv.sessionKey) {
          try {
            const result = await rpc('session.resume', { session_id: conv.sessionKey });
            conv.hermesSid = result.session_id;
            resumed = true;
            doSwitchConv(id);
            break;
          } catch (e) { conv.hermesSid = null; }
        }
      }
      if (!resumed) { doSwitchConv(ids[0]); await newConversation(); }
      else {
        for (const id of ids) { if (id !== activeConvId) conversations[id].hermesSid = null; }
        save();
      }
    } else {
      await newConversation();
    }
  } catch (e) {
    setConn('error');
    addSystemMsg('连接失败: ' + e.message);
  }
}

function connectWS(url) {
  return new Promise((resolve, reject) => {
    _userDisconnect = false;
    ws = new WebSocket(url);
    ws.onopen = () => { setConn('connected'); startHeartbeat(); };
    ws.onmessage = (e) => handleWS(JSON.parse(e.data), resolve);
    ws.onerror = () => { setConn('error'); stopHeartbeat(); reject(new Error('WS error')); };
    ws.onclose = () => {
      stopHeartbeat();
      setConn('disconnected');
      if (!_userDisconnect && brokerInfo) autoReconnect();
    };
  });
}

function handleWS(data, initResolve) {
  if (data.method === 'event') {
    const t = data.params?.type;
    const evtSid = data.params?.session_id || null;

    if (t === 'gateway.ready') { initResolve(); return; }

    if (t === 'message.start') {
      const convId = convByHermesSid(evtSid);
      if (convId) {
        streamState[convId] = { streamText: '' };
        if (convId === activeConvId) showStreamingUI();
      }
      return;
    }

    if (t === 'message.delta') {
      const convId = convByHermesSid(evtSid);
      if (convId && streamState[convId]) {
        streamState[convId].streamText += data.params?.payload?.text || '';
        if (convId === activeConvId) {
          const body = document.getElementById('streamBody');
          if (body) body.textContent = streamState[convId].streamText;
          scrollBottom();
        }
      }
      return;
    }

    if (t === 'message.complete') {
      const convId = convByHermesSid(evtSid);
      if (convId && streamState[convId]) {
        const text = streamState[convId].streamText;
        delete streamState[convId];
        const el = document.getElementById('streamingMsg');
        if (el) el.classList.remove('streaming');

        const conv = conversations[convId];
        if (conv && text) {
          conv.messages.push({ role: 'assistant', text, ts: Date.now() });
          conv.updatedAt = Date.now();
          save();
        }
        renderSessionList();
        enableInput();
        if (conv && !conv.sessionKey) fetchSessionKey(conv.id);
        // Fetch usage after response
        if (conv?.hermesSid) fetchUsage(conv.id);
      }
      return;
    }

    if (t === 'error') {
      addSystemMsg('错误: ' + (data.params?.payload?.message || ''));
      if (evtSid) { const c = convByHermesSid(evtSid); if (c) delete streamState[c]; }
      enableInput();
      return;
    }
    if (t === 'tool.start') {
      const convId = convByHermesSid(evtSid);
      if (convId === activeConvId) addSystemMsg('使用工具: ' + (data.params?.payload?.name || ''));
      return;
    }
    if (['tool.complete','session.info','thinking.delta','reasoning.delta','reasoning.available','status.update'].includes(t)) return;
  }

  // RPC responses
  if (data.id && pending[data.id]) {
    const { resolve, reject } = pending[data.id];
    delete pending[data.id];
    if (data.error) reject(new Error(data.error.message || JSON.stringify(data.error)));
    else resolve(data.result || {});
  }
}

function rpc(method, params) {
  return new Promise((resolve, reject) => {
    const id = String(++rpcId);
    pending[id] = { resolve, reject };
    const p = { jsonrpc: '2.0', id, method };
    if (params) p.params = params;
    ws.send(JSON.stringify(p));
  });
}

// ── Hermes HTTP ──

async function hermesHTTP(method, path, body) {
  if (!brokerInfo) throw new Error('未连接');
  const opts = { method, headers: { 'Authorization': 'Bearer ' + brokerInfo.ws_token } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const resp = await fetch(brokerInfo.http_url + path, opts);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const text = await resp.text();
  try { return JSON.parse(text); } catch(e) { return { raw: text }; }
}

async function loadServerSessions() {
  try {
    const data = await hermesHTTP('GET', '/api/sessions');
    const byKey = {};
    for (const c of Object.values(conversations)) { if (c.sessionKey) byKey[c.sessionKey] = c; }

    for (const s of (data.sessions || [])) {
      const local = byKey[s.id];
      if (local) {
        if (s.title && s.title !== '新会话' && s.title !== '未命名会话') local.title = s.title;
        local._msgCount = s.message_count || 0;
      } else {
        const convId = 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        conversations[convId] = {
          id: convId, hermesSid: null, sessionKey: s.id,
          title: s.title || '未命名会话', messages: [],
          createdAt: (s.started_at||0)*1000 || Date.now(),
          updatedAt: (s.started_at||0)*1000 || Date.now(),
          _loaded: false, _msgCount: s.message_count || 0,
        };
      }
    }
    save(); renderSessionList();
  } catch (e) { console.warn('加载服务端会话失败:', e); }
}

async function loadSessionMessages(convId) {
  const conv = conversations[convId];
  if (!conv?.sessionKey || conv._loaded) return;
  try {
    const data = await hermesHTTP('GET', '/api/sessions/' + conv.sessionKey + '/messages');
    conv.messages = (data.messages || [])
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .map(m => ({ role: m.role, text: typeof m.content === 'string' ? m.content : JSON.stringify(m.content), ts: Date.now() }));
    conv._loaded = true;
    if ((conv.title === '未命名会话' || conv.title === '新会话') && conv.messages.length > 0) {
      const first = conv.messages.find(m => m.role === 'user');
      if (first) conv.title = first.text.slice(0, 30) + (first.text.length > 30 ? '...' : '');
    }
    save();
  } catch (e) { addSystemMsg('加载历史失败'); }
}

// ── Heartbeat & Reconnect ──

function startHeartbeat() {
  stopHeartbeat();
  _heartbeatTimer = setInterval(() => {
    if (ws?.readyState === WebSocket.OPEN) ws.send('{"jsonrpc":"2.0","method":"ping","id":"_hb"}');
  }, 30000);
}

function stopHeartbeat() { if (_heartbeatTimer) { clearInterval(_heartbeatTimer); _heartbeatTimer = null; } }

function cancelReconnect() { if (_reconnectTimer) { clearTimeout(_reconnectTimer); _reconnectTimer = null; } _reconnectAttempts = 0; }

async function autoReconnect() {
  cancelReconnect();
  if (_reconnectAttempts >= MAX_RECONNECT) { addSystemMsg('重连已达上限，请刷新页面'); setConn('error'); return; }
  _reconnectAttempts++;
  const delay = Math.min(3000 + 2000 * _reconnectAttempts, 30000);
  setConn('connecting');
  addSystemMsg(`${Math.round(delay/1000)}秒后重连 (${_reconnectAttempts}/${MAX_RECONNECT})`);

  _reconnectTimer = setTimeout(async () => {
    try {
      const url = $('brokerUrl').value.replace(/\/+$/, '');
      const uid = $('userId').value.trim();
      let resp = await fetch(url + '/broker/sessions/' + uid);
      if (resp.ok) { brokerInfo = await resp.json(); }
      else {
        resp = await fetch(url + '/broker/sessions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user_id:uid}) });
        if (!resp.ok) throw new Error('重新分配失败');
        brokerInfo = await resp.json();
      }
      await connectWS(brokerInfo.ws_url);
      _reconnectAttempts = 0;
      if (activeConvId && conversations[activeConvId]?.sessionKey) {
        try {
          const r = await rpc('session.resume', { session_id: conversations[activeConvId].sessionKey });
          conversations[activeConvId].hermesSid = r.session_id;
          save(); renderMessages();
          addSystemMsg('已自动重连');
        } catch (e) { addSystemMsg('恢复会话失败: ' + e.message); }
      }
      enableInput();
      for (const [id, c] of Object.entries(conversations)) { if (id !== activeConvId) c.hermesSid = null; }
      save();
    } catch (e) { addSystemMsg('重连失败: ' + e.message); autoReconnect(); }
  }, delay);
}

async function disconnect() {
  _userDisconnect = true;
  cancelReconnect(); stopHeartbeat();
  if (ws) { ws.close(); ws = null; }
  if (brokerInfo) {
    try { await fetch($('brokerUrl').value.replace(/\/+$/,'') + '/broker/sessions/' + $('userId').value.trim(), { method: 'DELETE' }); } catch(e) {}
    brokerInfo = null;
  }
  streamState = {}; activeConvId = null; conversations = {};
  setConn('disconnected');
  $('loginSection').style.display = '';
  $('btnNewChat').style.display = 'none';
  $('sidebarFooter').style.display = 'none';
  $('sessionList').innerHTML = '<div class="session-empty">连接后显示会话</div>';
  $('messages').innerHTML = '<div class="empty-state" id="emptyState"><div class="logo">&#9889;</div><p>连接服务器开始对话</p></div>';
  disableInput();
}

// ── Conversation management ──

async function newConversation() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    const result = await rpc('session.create', {});
    const convId = 'conv_' + Date.now();
    conversations[convId] = {
      id: convId, hermesSid: result.session_id, sessionKey: null,
      title: '新会话', messages: [], createdAt: Date.now(), updatedAt: Date.now(),
    };
    doSwitchConv(convId);
    save(); renderSessionList(); enableInput(); $('input').focus();
    fetchSessionKey(convId);
  } catch (e) { addSystemMsg('创建失败: ' + e.message); }
}

async function fetchSessionKey(convId) {
  const conv = conversations[convId];
  if (!conv || conv.sessionKey) return;
  try {
    const s = await rpc('session.status', { session_id: conv.hermesSid });
    const m = (s.output || '').match(/Session ID:\s*(.+)/);
    if (m?.[1]) { conv.sessionKey = m[1].trim(); save(); }
  } catch (e) {}
}

function doSwitchConv(convId) {
  activeConvId = convId;
  renderSessionList(); renderMessages(); enableInput();
}

async function switchConversation(convId) {
  if (!conversations[convId] || convId === activeConvId) return;
  const conv = conversations[convId];

  if (!conv.hermesSid && conv.sessionKey && ws?.readyState === WebSocket.OPEN) {
    try {
      const r = await rpc('session.resume', { session_id: conv.sessionKey });
      conv.hermesSid = r.session_id; save();
    } catch (e) { addSystemMsg('无法恢复: ' + e.message); }
  }

  activeConvId = convId;
  renderSessionList();

  if (conv.messages.length === 0 && conv.sessionKey && !conv._loaded) await loadSessionMessages(convId);
  renderMessages();

  if (isConvStreaming(convId) && !document.getElementById('streamingMsg')) {
    showStreamingUI();
    const body = document.getElementById('streamBody');
    if (body) body.textContent = streamState[convId].streamText;
    scrollBottom();
  }

  conv.hermesSid && !isConvStreaming(convId) ? enableInput() : disableInput();
  fetchUsage(convId);
}

async function deleteConversation(convId, event) {
  event?.stopPropagation();
  if (!conversations[convId] || isConvStreaming(convId)) return;
  const conv = conversations[convId];
  if (conv.hermesSid && ws?.readyState === WebSocket.OPEN) {
    try { await rpc('session.close', { session_id: conv.hermesSid }); } catch(e) {}
  }
  if (conv.sessionKey) { try { await hermesHTTP('DELETE', '/api/sessions/' + conv.sessionKey); } catch(e) {} }

  delete conversations[convId]; delete streamState[convId]; save();

  if (convId === activeConvId) {
    activeConvId = null;
    const rest = Object.keys(conversations);
    rest.length > 0 ? doSwitchConv(rest[rest.length-1]) : ($('messages').innerHTML = '', disableInput(), addSystemMsg('会话已删除'));
  } else { renderSessionList(); }
}

// ── Session rename ──

function startRename(convId, event) {
  event?.stopPropagation();
  const conv = conversations[convId];
  if (!conv) return;
  const el = document.querySelector(`[data-conv-id="${convId}"] .session-title`);
  if (!el) return;
  const input = document.createElement('input');
  input.className = 'session-title-input';
  input.value = conv.title;
  el.replaceWith(input);
  input.focus(); input.select();

  const finish = async () => {
    const newTitle = input.value.trim() || conv.title;
    conv.title = newTitle; save(); renderSessionList();
    if (conv.hermesSid && ws?.readyState === WebSocket.OPEN) {
      try { await rpc('session.title', { session_id: conv.hermesSid, title: newTitle }); } catch(e) {}
    }
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = conv.title; input.blur(); } });
}

// ── Undo ──

async function undoLastTurn() {
  const conv = conversations[activeConvId];
  if (!conv?.hermesSid || isConvStreaming(activeConvId)) return;
  try {
    const result = await rpc('session.undo', { session_id: conv.hermesSid });
    if (result.undone) {
      // Remove last user + assistant message pair
      for (let i = conv.messages.length - 1; i >= 0; i--) {
        if (conv.messages[i].role === 'assistant' || conv.messages[i].role === 'user') {
          conv.messages.splice(i, 1);
          if (conv.messages[i-1]?.role === 'user') { conv.messages.splice(i-1, 1); break; }
          break;
        }
      }
      save(); renderMessages();
      addSystemMsg('已撤销上一轮');
    }
  } catch (e) { addSystemMsg('撤销失败: ' + e.message); }
}

// ── Compress ──

async function compressConversation(convId, event) {
  event?.stopPropagation();
  const conv = conversations[convId];
  if (!conv?.hermesSid) { addSystemMsg('请先打开该会话'); return; }
  try {
    const r = await rpc('session.compress', { session_id: conv.hermesSid, strategy: 'last' });
    addSystemMsg(`历史已压缩: ${r.old_count || '?'} → ${r.new_count || '?'} 条`);
  } catch (e) { addSystemMsg('压缩失败: ' + e.message); }
}

  const conv = conversations[convId];
  if (!conv?.hermesSid) return;
  try {
    const u = await rpc('session.usage', { session_id: conv.hermesSid });

  } catch (e) {}

function fmtTokens(n) { return n >= 1000 ? (n/1000).toFixed(1) + 'k' : String(n); }

// ── Image upload ──

function handleFileSelect(event) {
  const file = event.target.files?.[0];
  if (file?.type?.startsWith('image/')) attachImage(file);
  event.target.value = '';
}

async function attachImage(file) {
  const conv = conversations[activeConvId];
  if (!conv?.hermesSid) { addSystemMsg('请先创建会话'); return; }
  try {
    const reader = new FileReader();
    reader.onload = async (e) => {
      const base64 = e.target.result;
      addSystemMsg('正在上传图片...');
      try {
        await rpc('image.attach', { session_id: conv.hermesSid, path: file.name });
        addSystemMsg('图片已附加: ' + file.name);
      } catch (err) { addSystemMsg('上传失败: ' + err.message); }
    };
    reader.readAsDataURL(file);
  } catch (e) { addSystemMsg('读取文件失败'); }
}

// ── Send message ──

async function sendMessage() {
  const el = $('input');
  const text = el.value.trim();
  if (!text || !ws || !activeConvId || isConvStreaming(activeConvId)) return;

  const conv = conversations[activeConvId];
  if (!conv?.hermesSid) { addSystemMsg('会话已过期'); return; }

  conv.messages.push({ role: 'user', text, ts: Date.now() });
  conv.updatedAt = Date.now();
  if (conv.title === '新会话') {
    conv.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
    // Update server title
    rpc('session.title', { session_id: conv.hermesSid, title: conv.title }).catch(() => {});
    renderSessionList();
  }
  save(); addUserMsg(text);
  el.value = ''; el.style.height = 'auto';
  disableInput();

  try {
    const result = await rpc('prompt.submit', { session_id: conv.hermesSid, text });
    if (result.status !== 'streaming') {
      conv.messages.push({ role: 'assistant', text: JSON.stringify(result), ts: Date.now() });
      conv.updatedAt = Date.now(); save();
      addAssistantMsg(JSON.stringify(result)); enableInput();
    }
  } catch (e) { addSystemMsg('发送失败: ' + e.message); enableInput(); }
}

// ── Rendering ──

function _timeGroup(ts) {
  const now = new Date();
  const d = new Date(ts);
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const yesterdayStart = todayStart - 86400000;
  const weekStart = todayStart - 7 * 86400000;
  if (ts >= todayStart) return '今天';
  if (ts >= yesterdayStart) return '昨天';
  if (ts >= weekStart) return '过去 7 天';
  return '更早';
}

function renderSessionList() {
  const list = $('sessionList');
  const sorted = Object.values(conversations).sort((a, b) => (b.updatedAt||0) - (a.updatedAt||0));
  if (sorted.length === 0) { list.innerHTML = '<div class="session-empty">暂无会话</div>'; return; }

  const groups = [];
  const groupOrder = ['今天', '昨天', '过去 7 天', '更早'];
  const groupMap = {};
  for (const c of sorted) {
    const g = _timeGroup(c.updatedAt || Date.now());
    if (!groupMap[g]) { groupMap[g] = []; groups.push(g); }
    groupMap[g].push(c);
  }

  let html = '';
  for (const g of groups) {
    html += `<div class="session-group-label">${g}</div>`;
    for (const c of groupMap[g]) {
      const active = c.id === activeConvId;
      html += `<div class="session-item${active ? ' active' : ''}" data-conv-id="${c.id}" onclick="switchConversation('${c.id}')">
        <span class="session-title">${esc(c.title)}</span>
        <span class="session-actions">
          <button class="session-action-btn" onclick="startRename('${c.id}',event)" title="重命名">&#9998;</button>
          <button class="session-action-btn" onclick="compressConversation('${c.id}',event)" title="压缩历史">&#128196;</button>
          <button class="session-action-btn danger" onclick="deleteConversation('${c.id}',event)" title="删除">&times;</button>
        </span>
      </div>`;
    }
  }
  list.innerHTML = html;
}

function renderMessages() {
  const container = $('messages');
  const conv = conversations[activeConvId];
  if (!conv || conv.messages.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="logo">&#9889;</div><p>开始对话吧</p></div>';
    return;
  }
  container.innerHTML = '';
  for (const m of conv.messages) {
    if (m.role === 'user') _appendMsg(container, 'user', m.text);
    else if (m.role === 'assistant') _appendMsg(container, 'assistant', m.text);
  }
  scrollBottom();
}

function _appendMsg(container, role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="msg-label">${role === 'user' ? 'You' : 'Hermes'}</div><div class="msg-body">${esc(text)}</div>`;
  container.appendChild(div);
}

function showStreamingUI() {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'msg assistant streaming'; div.id = 'streamingMsg';
  div.innerHTML = '<div class="msg-label">Hermes</div><div class="msg-body" id="streamBody"></div>';
  $('messages').appendChild(div); scrollBottom();
}

// ── UI helpers ──

function setConn(state) {
  const dot = $('connDot');
  const label = $('connLabel');
  if (!dot) return;

  const header = dot.parentElement;
  if (state === 'connected') { dot.className = 'conn-dot ok'; if (header) header.innerHTML = '<span class="conn-dot ok" id="connDot"></span><span class="conn-label" id="connLabel">已连接</span>'; }
  else if (state === 'connecting') { if (header) header.innerHTML = '<span class="conn-dot" id="connDot"></span><span class="conn-label" id="connLabel">连接中…</span>'; $('btnConnect').disabled = true; }
  else if (state === 'error') { if (header) header.innerHTML = '<span class="conn-dot" id="connDot"></span><span class="conn-label" id="connLabel">未连接</span>'; $('btnConnect').disabled = false; }
  else { if (header) header.innerHTML = '<span class="conn-dot" id="connDot"></span><span class="conn-label" id="connLabel">未连接</span>'; $('btnConnect').disabled = false; }
}

function enableInput() {
  if (isConvStreaming(activeConvId)) return;

  $('attachBtn').disabled = false; $('undoBtn').disabled = false;

function disableInput() {

}

function hideEmpty() { const e = $('emptyState'); if (e) e.style.display = 'none'; }

function addUserMsg(text) {

function addAssistantMsg(text) {

function addSystemMsg(text) {

function scrollBottom() { const m = $('messages'); m.scrollTop = m.scrollHeight; }

async function loadSettings() {
  const body = $('settingsBody');
  body.innerHTML = '<div class="settings-loading">加载中…</div>';

  // Load all sections in parallel
  const [modelRes, usageRes, skillsRes, cronRes] = await Promise.allSettled([
    (async () => {
      const [info, options] = await Promise.all([
        hermesHTTP('GET', '/api/model/info'),
        hermesHTTP('GET', '/api/model/options').catch(() => null)
      ]);
      return { info, options };
    })(),
    hermesHTTP('GET', '/api/analytics/usage?days=30').catch(e => ({ _error: e.message })),
    hermesHTTP('GET', '/api/skills').catch(e => ({ _error: e.message })),
    hermesHTTP('GET', '/api/cron/jobs').catch(e => ({ _error: e.message }))
  ]);

  // ── Model card ──
  let modelCard = '';
  if (modelRes.status === 'fulfilled') {
    const { info, options } = modelRes.value;
    const cap = info.capabilities || {};
    const modelOpts = options?.models || (Array.isArray(options) ? options : []);
    let optHtml = `<option value="${esc(info.model)}" selected>${esc(info.model)}</option>`;
    for (const m of modelOpts) {
      const name = typeof m === 'string' ? m : (m.model || m.name || '');

    }
    modelCard = `
      <div class="s-card-title">Model</div>
      <div class="s-row" style="margin-bottom:8px"><span class="s-row-label">模型</span>
        <select class="s-select" onchange="settingsSwitchModel(this.value)">${optHtml}</select>
      </div>
      <div class="s-row"><span class="s-row-label">Provider</span><span class="s-row-value">${esc(info.provider || '-')}</span></div>
      <div class="s-row"><span class="s-row-label">Context</span><span class="s-row-value">${fmtTokens(cap.context_window || info.effective_context_length || 0)}</span></div>
      <div class="s-row"><span class="s-row-label">Max Output</span><span class="s-row-value">${fmtTokens(cap.max_output_tokens || 0)}</span></div>
      <div class="s-row"><span class="s-row-label">Tools</span><span class="s-row-value">${cap.supports_tools ? '&#10003;' : '&#10007;'}</span></div>
      <div class="s-row"><span class="s-row-label">Vision</span><span class="s-row-value">${cap.supports_vision ? '&#10003;' : '&#10007;'}</span></div>
      <div class="s-row"><span class="s-row-label">Reasoning</span><span class="s-row-value">${cap.supports_reasoning ? '&#10003;' : '&#10007;'}</span></div>
      <div class="s-row"><span class="s-row-label">Family</span><span class="s-row-value">${esc(cap.model_family || '-')}</span></div>`;
  } else {
    modelCard = '<div style="color:var(--danger);padding:8px 0">加载失败</div>';
  }

  // ── Usage card ──
  let usageCard = '';
  if (usageRes.status === 'fulfilled' && !usageRes.value._error) {
    const data = usageRes.value;
    const entries = data.usage || data.daily || data.entries || [];
    let totalIn = 0, totalOut = 0, totalCost = 0;
    if (Array.isArray(entries)) {
      for (const e of entries) {
        totalIn += e.input_tokens || 0;
        totalOut += e.output_tokens || 0;
        totalCost += parseFloat(e.estimated_cost_usd || 0);
      }
    }

    let detailRows = '';
    if (Array.isArray(entries)) {
      for (const e of entries) {
        detailRows += `<tr>
          <td>${esc(e.date || e.day || '-')}</td>
          <td>${fmtTokens(e.input_tokens || 0)}</td>
          <td>${fmtTokens(e.output_tokens || 0)}</td>
          <td>${e.sessions || e.session_count || '-'}</td>
          <td>$${(parseFloat(e.estimated_cost_usd || 0)).toFixed(4)}</td>
        </tr>`;
      }
    }

    usageCard = `
      <div class="s-card-title">Usage <span style="font-weight:400;color:var(--text-dim);font-size:12px">（30 天）</span></div>
      <div class="s-row"><span class="s-row-label">Input Tokens</span><span class="s-row-value">${fmtTokens(totalIn)}</span></div>
      <div class="s-row"><span class="s-row-label">Output Tokens</span><span class="s-row-value">${fmtTokens(totalOut)}</span></div>
      <div class="s-row"><span class="s-row-label">预估费用</span><span class="s-row-value">$${totalCost.toFixed(4)}</span></div>
      ${detailRows ? `<table class="usage-table" style="margin-top:12px">
        <tr><th>日期</th><th>输入</th><th>输出</th><th>会话</th><th>费用</th></tr>${detailRows}
      </table>` : ''}`;
  } else {
    usageCard = '<div style="color:var(--danger);padding:8px 0">加载失败</div>';
  }

  // ── Skills card ──
  let skillsCard = '';
  if (skillsRes.status === 'fulfilled' && !skillsRes.value._error) {
    const raw = skillsRes.value;
    const list = Array.isArray(raw) ? raw : (raw.skills || []);
    skillsCard = `
      <div class="s-card-title">Skills</div>
      <div class="skill-search">
        <input id="skillSearchInput" placeholder="搜索技能…" onkeydown="if(event.key==='Enter')searchSkills()">
        <button onclick="searchSkills()">搜索</button>
      </div>
      <div class="skill-search">
        <input id="skillInstallInput" placeholder="安装技能（名称）">
        <button onclick="installSkill()">安装</button>
      </div>`;
    for (const s of list) {
      skillsCard += `<div class="skill-item">
        <div class="skill-info"><div class="skill-name">${esc(s.name)}</div><div class="skill-desc">${esc(s.description || '')}</div></div>
        <label class="toggle"><input type="checkbox" ${s.enabled ? 'checked' : ''} onchange="toggleSkill('${esc(s.name)}',this.checked)"><span class="toggle-slider"></span></label>
      </div>`;
    }
    if (list.length === 0) skillsCard += '<div class="s-empty">暂无技能</div>';
    skillsCard += '<div id="skillSearchResults"></div>';
  } else {
    skillsCard = '<div style="color:var(--danger);padding:8px 0">加载失败</div>';
  }

  // ── Cron card ──
  let cronCard = '';
  if (cronRes.status === 'fulfilled' && !cronRes.value._error) {
    const raw = cronRes.value;
    const jobs = Array.isArray(raw) ? raw : (raw.jobs || []);
    cronCard = `
      <div class="s-card-title">Scheduled Tasks</div>
      <button class="btn btn-primary" style="margin-bottom:12px;max-width:140px" onclick="showCronForm()">+ 新建任务</button>
      <div id="cronFormArea"></div>`;
    for (const j of jobs) {
      const paused = j.paused || j.status === 'paused';
      cronCard += `<div class="cron-item">
        <div class="cron-header">
          <span class="cron-name">${esc(j.name || j.id || '未命名')}</span>
          <div class="cron-actions">
            ${paused
              ? `<button class="cron-btn" onclick="cronAction('${esc(j.id)}','resume')">恢复</button>`
              : `<button class="cron-btn" onclick="cronAction('${esc(j.id)}','pause')">暂停</button>`}
            <button class="cron-btn" onclick="cronAction('${esc(j.id)}','trigger')">触发</button>
            <button class="cron-btn danger" onclick="cronAction('${esc(j.id)}','delete')">删除</button>
          </div>
        </div>
        <div class="cron-schedule">${esc(j.schedule || j.cron || '-')}</div>
        <div class="cron-prompt">${esc(j.prompt || '')}</div>
      </div>`;
    }
    if (jobs.length === 0) cronCard += '<div class="s-empty">暂无定时任务</div>';
  } else {
    cronCard = '<div style="color:var(--danger);padding:8px 0">加载失败</div>';
  }

  body.innerHTML = `
    <div class="s-card">${modelCard}</div>
    <div class="s-card">${usageCard}</div>
    <div class="s-card">${skillsCard}</div>
    <div class="s-card">${cronCard}</div>`;
}

async function settingsSwitchModel(model) {
  try {
    await hermesHTTP('POST', '/api/model/set', { scope: 'main', model });
    currentModel = model;
    addSystemMsg('模型已切换为 ' + model);
  } catch (e) {
    addSystemMsg('切换失败: ' + e.message);
  }
}

async function toggleSkill(name, enabled) {
  try {
    await hermesHTTP('PUT', '/api/skills/toggle', { name, enabled });
  } catch (e) {
    addSystemMsg('切换技能失败: ' + e.message);
  }
}

async function searchSkills() {
  const q = $('skillSearchInput')?.value?.trim();
  if (!q || !ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    const r = await rpc('skills.manage', { action: 'search', query: q });
    const results = r.results || [];
    let html = '';
    if (results.length === 0) {
      html = '<div class="s-empty">无结果</div>';
    } else {
      for (const s of results) {
        html += `<div class="skill-item">
          <div class="skill-info"><div class="skill-name">${esc(s.name)}</div><div class="skill-desc">${esc(s.description || '')}</div></div>
          <button class="cron-btn" style="border-color:var(--accent);color:var(--accent)" onclick="installSkillByName('${esc(s.name)}')">安装</button>
        </div>`;
      }
    }
    $('skillSearchResults').innerHTML = html;
  } catch (e) { addSystemMsg('搜索失败: ' + e.message); }
}

async function installSkill() {
  const q = $('skillInstallInput')?.value?.trim();
  if (q) await installSkillByName(q);
}

async function installSkillByName(name) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { addSystemMsg('WS 未连接'); return; }
  try {
    const r = await rpc('skills.manage', { action: 'install', query: name });
    addSystemMsg('技能已安装: ' + (r.name || name));
    loadSettings();
  } catch (e) { addSystemMsg('安装失败: ' + e.message); }
}

function showCronForm() {
  $('cronFormArea').innerHTML = `
    <div class="cron-form">
      <input id="cronName" placeholder="任务名称">
      <input id="cronSchedule" placeholder="定时表达式（如: 0 9 * * *）">
      <input id="cronPrompt" placeholder="执行内容 (prompt)">
      <select id="cronDeliver"><option value="default">默认投递</option><option value="silent">静默</option></select>
      <div class="cron-form-actions">
        <button class="btn btn-primary" onclick="createCronJob()">创建</button>
        <button class="btn" style="background:var(--border)" onclick="$('cronFormArea').innerHTML=''">取消</button>
      </div>
    </div>`;
}

async function createCronJob() {
  const name = $('cronName')?.value?.trim() || '未命名';
  const schedule = $('cronSchedule')?.value?.trim();
  const prompt = $('cronPrompt')?.value?.trim();
  const deliver = $('cronDeliver')?.value || 'default';
  if (!schedule || !prompt) { addSystemMsg('请填写定时表达式和执行内容'); return; }
  try {
    await hermesHTTP('POST', '/api/cron/jobs', { name, schedule, prompt, deliver });
    addSystemMsg('定时任务已创建');
    loadSettings();
  } catch (e) { addSystemMsg('创建失败: ' + e.message); }
}

async function cronAction(id, action) {
  try {
    if (action === 'delete') {
      await hermesHTTP('DELETE', '/api/cron/jobs/' + id);
      addSystemMsg('任务已删除');
    } else {
      await hermesHTTP('POST', '/api/cron/jobs/' + id + '/' + action);
      addSystemMsg('任务已' + ({pause:'暂停',resume:'恢复',trigger:'触发'}[action] || action));
    }
    loadSettings();
  } catch (e) { addSystemMsg('操作失败: ' + e.message); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('settingsCol').style.display !== 'none') closeSettings(); });
</script>
</body>
</html>

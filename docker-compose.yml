# ──────────────────────────────────────────────────────────────────────────
# Hermes Platform 生产级 docker-compose（单机部署）
# 适用：腾讯云 CVM / 阿里云 ECS / 任何 Ubuntu + Docker 的 Linux 主机
#
# 关键设计：
#   - memory 12G 上限：根治现网 17:30 OOM（broker + per-user agent 总和上限）
#   - restart: always：broker 死了自动拉起（宿主机重启也生效）
#   - 命名卷 sessions-data：用户会话持久化，与镜像解耦
#   - healthcheck + start_period 30s：给 broker 冷启动留时间
#   - 只读挂载 secrets（auth.json/.env/config.yaml）：避免容器内被改
#   - json-file 日志：自动轮转（10M x 3），不撑爆磁盘
#   - HERMES_NGINX_DOMAIN：用 .env 注入，便于多环境切换
#
# 用法：
#   cp .env.example .env       # 编辑 .env 填入域名等
#   docker compose up -d
#   docker compose logs -f hermes
#   docker compose ps
# ──────────────────────────────────────────────────────────────────────────

services:
  hermes:
    # 镜像来源二选一（用 uncomment 切换）：
    # A. 本地构建的镜像（最简单，CVM 上 build 后直接用）
    # image: hermes-platform:v1
    # B. 从腾讯云 TCR 拉（推荐，需先推到 TCR；走内网极快）
    image: qx-images.tencentcloudcr.com/qunxing/hermes-platform:v1
    container_name: hermes
    restart: always

    # 端口：容器内 nginx 监听 80 做动态端口路由 + WS Origin 伪造
    # 宿主机 nginx (systemd) 反向代理到容器 80 → 简化 SSL/证书管理
    # 如果你不想用宿主机 nginx，也可以直接暴露 80/443 给容器
    # (那需要把 SSL 证书挂进容器或用其它方式)
    ports:
      - "8080:80"     # 容器 nginx（HTTP）。改端口避开与宿主机 nginx 冲突。
      # - "443:443"   # 若想让容器直接处理 HTTPS（需挂证书，见 docker-compose 注释）

    # 环境变量：
    #   - 必要项直接写在 environment（不依赖外部文件）
    #   - HERMES_NGINX_DOMAIN 用 ${VAR:-default} 语法，从执行环境的 .env 或 shell 读
    #     （docker compose 会自动加载执行目录的 .env；文件不存在也不报错）
    #   - 部署时：cp .env.example .env，编辑 HERMES_NGINX_DOMAIN=你的域名
    environment:
      SESSIONS_ROOT: /var/lib/hermes/sessions
      HERMES_HOME: /root/.hermes
      HERMES_PUBLIC_HOST: "127.0.0.1"
      HERMES_NGINX_DOMAIN: ${HERMES_NGINX_DOMAIN:-localhost}

    # 持久化与密钥挂载
    volumes:
      # 用户会话数据（命名卷，自动持久化到 /var/lib/docker/volumes/）
      - sessions-data:/var/lib/hermes/sessions

      # 镜像层已经 COPY 了 skills/cache/pairing/uv-python 等全局只读资源到 /root/.hermes/
      # 下面这三个含密钥，**不要** COPY 进镜像（k8s 阶段 Secret 挂载；这里挂文件）
      # 单机部署方案：直接 mount 主机文件，只读防止容器内被改
      - /root/.hermes/auth.json:/root/.hermes/auth.json:ro
      - /root/.hermes/.env:/root/.hermes/.env:ro
      - /root/.hermes/config.yaml:/root/.hermes/config.yaml:ro

      # （可选）宿主机日志目录，便于 ELK/SLS/Loki 直接采集
      # - /var/log/hermes:/var/log/hermes

    # 健康检查：broker 起来了再认为 healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1/broker/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s   # broker 冷启动可能需要 10-20s

    # 日志：json-file 驱动，自动轮转（避免单个日志文件撑爆磁盘）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 资源限制：根治今天 17:30 OOM
    # memory 12G 包含 broker + 所有 per-user 子进程总和
    # 16G 总内存的系统：broker 占 12G，宿主机 + 系统预留 4G
    # 如果是 32G 总内存：可放宽到 24G，留更多 headroom
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 512M

    # 安全选项
    security_opt:
      - no-new-privileges:true   # 禁止容器内提权
    read_only: false             # broker 写日志/uploads/状态
    # 沙箱候选（k8s 评审 P1，本机 docker 暂不开）：
    # cap_drop: [ALL]  + cap_add: [NET_BIND_SERVICE]  # 最小权限（broker 不需要 bind privileged）

    # 重启策略（除了 restart: always 之外的额外保护）
    # restart: always 已涵盖 broker crash / 宿主机重启
    # 若 broker 卡住不响应但进程在：靠 healthcheck（k8s 才有，docker compose 暂不支持自动重启）

volumes:
  sessions-data:
    name: hermes-sessions-data
    # 备份：可用 `docker run --rm -v hermes-sessions-data:/data -v $(pwd):/backup alpine tar czf /backup/sessions-$(date +%F).tar.gz -C /data .`
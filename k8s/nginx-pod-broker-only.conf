# ──────────────────────────────────────────────────────────────────────────
# pod 内 nginx（sidecar）—— CVM 单机 broker-only 版（无 openclaw / hermes_api）
#
# 与 k8s/nginx-pod.conf 的差异：
#   - 删除 upstream openclaw / hermes_api（CVM 上没有这俩服务，留着会让 nginx 启动 emerg）
#   - 原 proxy 到 openclaw/hermes_api 的 location 改为返回 503 + JSON（明确告知不可用）
#   - broker 核心链路 100% 保留：
#       /broker/  /auth/  /hermes/ws/*  /hermes/dash/*  /hermes/mcp-oauth-cb/*
#       /api/ws   /api/(sessions|upload|files|model|skills|...)   /chat  /docs
#
# 这个配置用于：腾讯云 CVM / 阿里云 ECS 等单机部署，只跑 broker + per-user agent。
# 用法（在 Dockerfile 里替换，或挂载覆盖）：
#   docker run -v /opt/hermes-platform/k8s/nginx-pod-broker-only.conf:/etc/nginx/conf.d/default.conf:ro ...
# 或重新 build 镜像时 COPY 它替代 nginx-pod.conf。
# ──────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
large_client_header_buffers 4 32k;

# 只保留 broker upstream（容器内）
upstream hermes_broker {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;
    client_body_timeout  300s;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 403 404 /404.json;
    error_page 413 /413.json;
    error_page 500 502 503 504 /50x.json;
    location = /404.json { internal; default_type application/json; return 404 '{"type":"error","error":{"type":"not_found","message":"Not found"}}'; }
    location = /413.json { internal; default_type application/json; return 413 '{"type":"error","error":{"type":"invalid_request_error","message":"Request body too large"}}'; }
    location = /50x.json { internal; default_type application/json; return 502 '{"type":"error","error":{"type":"api_error","message":"Upstream error"}}'; }

    # ════════════════════════════════════════════════════════════════════
    # broker 核心链路（全部保留，生产路径）
    # ════════════════════════════════════════════════════════════════════

    # ── broker ──
    location /broker/ {
        proxy_pass http://hermes_broker/broker/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    location /auth/ {
        proxy_pass http://hermes_broker/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 动态端口 WS 路由（9119-9200）+ Origin 伪造（Hermes 校验 Origin）──
    location ~ ^/hermes/ws/9(1[1-9][0-9]|200)/ {
        rewrite ^/hermes/ws/([0-9]+)/(.*)$ /$2 break;
        proxy_pass http://127.0.0.1:$1;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header Origin http://127.0.0.1:$1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
    }

    # ── 动态端口 REST：上传类经 broker（鉴权 + 落盘）──
    location ~ ^/hermes/dash/9(1[1-9][0-9]|200)/(api/upload|api/skills/upload) {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/hermes/dash/([0-9]+)/(.*)$ /$2 break;
        proxy_pass http://hermes_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 50m;
    }
    location ~ ^/hermes/dash/9(1[1-9][0-9]|200)/ {
        rewrite ^/hermes/dash/([0-9]+)/(.*)$ /$2 break;
        proxy_pass http://127.0.0.1:$1;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ── MCP OAuth 回调（动态端口）──
    location ~ ^/hermes/mcp-oauth-cb/([0-9]+)/callback {
        rewrite ^/hermes/mcp-oauth-cb/([0-9]+)/callback(.*)$ /callback$2 break;
        proxy_pass http://127.0.0.1:$1;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── broker WS / REST API ──
    location = /api/ws {
        proxy_pass http://hermes_broker/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
    }
    location ~ ^/api/(sessions|upload|files|model|skills|cron|config|env|status|analytics|screenshot|workdirs|mcp) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://hermes_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
    }

    # ── 静态前端 ──
    location = /chat {
        alias /opt/hermes-platform/chat.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /favicon.ico {
        alias /opt/hermes-platform/favicon.ico;
        default_type image/x-icon;
    }
    location /docs {
        proxy_pass http://hermes_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ════════════════════════════════════════════════════════════════════
    # 以下原走 openclaw / hermes_api —— CVM 无此服务，返回 503 明确错误
    # （broker 链路不受影响；如将来 CVM 部署这俩服务，恢复 upstream 即可）
    # ════════════════════════════════════════════════════════════════════

    # 根路径：返回静态前端（让用户能打开 chat.html），不走 openclaw
    location = / {
        return 302 /chat;
    }

    # 这些路径 CVM 暂不支持（原 openclaw / hermes_api）
    location ~ ^/hermes/v1/ {
        return 503 '{"type":"error","error":{"type":"unavailable","message":"hermes_api not deployed on this host"}}';
        default_type application/json;
    }
    location = /hermes/health {
        return 503 '{"type":"error","error":{"type":"unavailable","message":"hermes_api not deployed"}}';
        default_type application/json;
    }
    location /v1/messages {
        return 503 '{"type":"error","error":{"type":"unavailable","message":"openclaw gateway not deployed on this host"}}';
        default_type application/json;
    }
    location /v1/chat/completions {
        return 503 '{"type":"error","error":{"type":"unavailable","message":"openclaw gateway not deployed on this host"}}';
        default_type application/json;
    }
    location = /api/admin/login {
        return 503 '{"type":"error","error":{"type":"unavailable","message":"openclaw admin not deployed"}}';
        default_type application/json;
    }
    location /api/ {
        # 注意：上面 ^/api/(sessions|...) 已先匹配，到这里的是其他 /api/* （原 openclaw）
        return 503 '{"type":"error","error":{"type":"unavailable","message":"openclaw gateway not deployed on this host"}}';
        default_type application/json;
    }
    location = /health {
        return 503 '{"type":"error","error":{"type":"unavailable","message":"openclaw not deployed, use /broker/health"}}';
        default_type application/json;
    }
}

# ──────────────────────────────────────────────────────────────────────────
# pod 内 nginx（sidecar）—— 生产 openclaw.conf 的容器化版
#
# 与生产的差异（其余 location / 限流 / 动态端口路由 / Origin 伪造 原样保留）：
#   1. listen 80（非 443 ssl）—— TLS 由 k8s Ingress 终结，pod 内纯 HTTP
#   2. 去掉 ssl_* / HSTS（HSTS 由 Ingress 设置）
#   3. 去掉 80→443 跳转 server（Ingress 负责）
#   4. upstream 指向：
#        hermes_broker → 127.0.0.1:8080  （同 pod 的 broker 容器，共享 loopback）
#        hermes_api    → hermes-api:8642 （独立 Deployment 的 Service）
#        openclaw      → openclaw:3000   （独立 Deployment 的 Service）
#   5. server_name _; —— 作为后端，捕获 Ingress 转发来的任意 Host
#
# $connection_upgrade map 由 Dockerfile 写入 00-map-upgrade.conf（http 上下文）
# limit_req_zone 在 conf.d（http 上下文）声明，合法。
# ──────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
large_client_header_buffers 4 32k;

upstream openclaw {
    server openclaw:3000;
    keepalive 32;
}
upstream hermes_api {
    server hermes-api:8642;
    keepalive 16;
}
upstream hermes_broker {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;
    client_body_timeout  300s;  # Hermes 响应可能较慢

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 403 404 /404.json;
    error_page 413 /413.json;
    error_page 500 502 503 504 /50x.json;
    location = /404.json { internal; default_type application/json; return 404 '{"type":"error","error":{"type":"not_found","message":"Not found"}}'; }
    location = /413.json { internal; default_type application/json; return 413 '{"type":"error","error":{"type":"invalid_request_error","message":"Request body too large"}}'; }
    location = /50x.json { internal; default_type application/json; return 502 '{"type":"error","error":{"type":"api_error","message":"Upstream error"}}'; }

    # ── Agent API（OpenAI 兼容）──
    location /hermes/v1/chat/completions {
        proxy_pass http://hermes_api/v1/chat/completions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }
    location /hermes/v1/ {
        proxy_pass http://hermes_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    location /hermes/health {
        proxy_pass http://hermes_api/health;
        proxy_http_version 1.1;
    }

    # ── broker ──
    location /broker/ {
        proxy_pass http://hermes_broker/broker/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    location /auth/ {
        proxy_pass http://hermes_broker/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 动态端口 WS 路由（9119-9200）+ Origin 伪造（Hermes 校验 Origin）──
    location ~ ^/hermes/ws/9(1[1-9][0-9]|200)/ {
        rewrite ^/hermes/ws/([0-9]+)/(.*)$ /$2 break;
        proxy_pass http://127.0.0.1:$1;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header Origin http://127.0.0.1:$1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
    }

    # ── 动态端口 REST：上传类经 broker（鉴权 + 落盘）──
    location ~ ^/hermes/dash/9(1[1-9][0-9]|200)/(api/upload|api/skills/upload) {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/hermes/dash/([0-9]+)/(.*)$ /$2 break;
        proxy_pass http://hermes_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 50m;
    }
    location ~ ^/hermes/dash/9(1[1-9][0-9]|200)/ {
        rewrite ^/hermes/dash/([0-9]+)/(.*)$ /$2 break;
        proxy_pass http://127.0.0.1:$1;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ── MCP OAuth 回调（动态端口）──
    location ~ ^/hermes/mcp-oauth-cb/([0-9]+)/callback {
        rewrite ^/hermes/mcp-oauth-cb/([0-9]+)/callback(.*)$ /callback$2 break;
        proxy_pass http://127.0.0.1:$1;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── broker WS / REST API ──
    location = /api/ws {
        proxy_pass http://hermes_broker/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
    }
    location ~ ^/api/(sessions|upload|files|model|skills|cron|config|env|status|analytics|screenshot|workdirs|mcp) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://hermes_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
    }

    # ── openclaw 网关 ──
    location /api/admin/login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://openclaw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://openclaw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
    }
    location /v1/messages {
        proxy_pass http://openclaw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }
    location /v1/chat/completions {
        proxy_pass http://openclaw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ── 静态前端 ──
    location = /chat {
        alias /opt/hermes-platform/chat.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /favicon.ico {
        alias /opt/hermes-platform/favicon.ico;
        default_type image/x-icon;
    }
    location /docs {
        proxy_pass http://hermes_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 兜底 + 健康 ──
    location / {
        proxy_pass http://openclaw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /health {
        proxy_pass http://openclaw;
        proxy_http_version 1.1;
    }
}

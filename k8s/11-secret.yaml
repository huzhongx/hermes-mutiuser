# ── Secrets 模板（占位值，部署前必须替换为真实值）──────────────
# ⚠️ 切勿把真实密钥提交到 git！生产建议用：
#    kubectl -n hermes create secret generic hermes-secret \
#        --from-literal=GITHUB_CLIENT_ID=... --from-literal=GITHUB_CLIENT_SECRET=... \
#        --from-literal=POSTGRES_PASSWORD=... --from-literal=REDIS_URL=... \
#        --from-file=auth.json=/root/.hermes/auth.json
#    或用 SealedSecret / External Secrets / Vault。
#
# 本文件仅作字段清单与占位，方便初次理解需要哪些密钥。
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secret
  namespace: hermes
type: Opaque
stringData:
  GITHUB_CLIENT_ID: "<fill: GitHub OAuth app client id>"
  GITHUB_CLIENT_SECRET: "<fill: GitHub OAuth app client secret>"
  POSTGRES_PASSWORD: "<fill: hermes_secret_2026>"
  REDIS_URL: "<fill: redis://:redis_secret_2026@redis:6379/0>"
  # 全局凭证池（broker _spawn 软链到每用户 hermes_home）
  auth.json: |
    <fill: 本机 /root/.hermes/auth.json 全文>

---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-jwt
  namespace: hermes
type: Opaque
# 挂载到 /opt/hermes-platform/.jwt_secret（broker _JWT_SECRET_FILE）。
# broker 读到即用、不写回 —— 现有代码已对只读挂载安全（OSError fallback）。
# ⚠️ 为让现有 cookie 不失效：把本机当前 .jwt_secret 内容填到 jwt。
#    取值： cat /opt/hermes-platform/.jwt_secret   （64 hex）
stringData:
  jwt: "<fill: 本机 /opt/hermes-platform/.jwt_secret 的内容，64 hex>"

---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-tls
  namespace: hermes
type: kubernetes.io/tls
# 仅当不用 cert-manager 自动签发时挂载。Ingress tls.secretName 指向它。
# data: { tls.crt: <base64>, tls.key: <base64> }

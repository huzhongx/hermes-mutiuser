# ── Redis（翻译自 docker-compose.yml）──
# 阶段一 broker 不依赖；仅 api_server SaaS 模式用。可空挂待用。
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hermes
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: hermes
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--requirepass", "$(REDIS_PASS)", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
          env:
            - name: REDIS_PASS
              valueFrom: { secretKeyRef: { name: hermes-secret, key: POSTGRES_PASSWORD } }  # 占位；建议单独 key
          ports: [ { containerPort: 6379, name: redis } ]
          volumeMounts: [ { name: data, mountPath: /data } ]
          readinessProbe:
            exec: { command: ["redis-cli", "-a", "$(REDIS_PASS)", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "-a", "$(REDIS_PASS)", "ping"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 2Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
        # storageClassName: <your-class>
